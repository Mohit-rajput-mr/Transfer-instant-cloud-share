# Quality gate on every push and pull request: types, lint, unit tests, production build.
# (docs/ENGINEERING_DIRECTIVE.md §8). The build uses placeholder public env: it only proves the app compiles.
name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
          NEXT_PUBLIC_SUPABASE_ANON_KEY: x
          NEXT_TELEMETRY_DISABLED: "1"
