  lidPivot.rotation.x = lidA; big.scale.setScalar(Math.max(0.001, bigS)); big.visible = bigS > 0.01 && t < B0;
  const lockDrop = 1 - out(clamp((t - (t < S0 ? P0 + 4.2 : -99)) / 0.4));

  // the notes: all leave together on fanned arcs, park on the shelves; fly back for the friend; burn up

  const shutK = t < B0 ? (t < L0 ? clamp((t - V0 - 1.8) / 1.2) : 1 - clamp((t - L0) / 0.4)) : 1 - clamp((t - B0 - 0.2) / 0.6);

    look(BIG.x + 0.45 + lerp(-0.4, 0.3, k), lerp(2.3, 1.7, k), lerp(6.0, 4.4, k), BIG.x + 0.45, lerp(1.6, 0.55, k), 0.2, 46);
    S($("flash"), { opacity: Math.max(0, 0.9 - (t - P0) * 2) });

  } else if (t < V0) {

  } else if (t < L0 + 5.0) {
