import * as THREE from "three";

const W = 1080, H = 1920;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

const LINES = (await (await fetch("vo/lines.json")).json());
const L = Object.fromEntries(LINES.lines.map((l) => [l.key, l]));
const at = (k) => L[k].at, end = (k) => L[k].at + L[k].dur;
window.DURATION = LINES.duration;

// ---------- renderer ----------
const r = new THREE.WebGLRenderer({ canvas: $("gl"), antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(W, H, false);
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05; r.outputColorSpace = THREE.SRGBColorSpace;

// ---------- helpers: textures ----------

const img = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = src; });
const IM = {};
for (const k of ["empty", "one", "many", "card"]) IM[k] = await img(`shots/${k}.png`);
IM.photo = await img("dusk.jpg");

// ---------- world 1: the café ----------
const cafe = new THREE.Group(); scene.add(cafe);
const wood = canvasTex(512, 512, (g, w, h) => { g.fillStyle = "#7a4a2c"; g.fillRect(0, 0, w, h); for (let i = 0; i < 16; i++) { g.fillStyle = i % 2 ? "#6c3f25" : "#83512f"; g.fillRect(0, i * 32, w, 30); g.fillStyle = "rgba(0,0,0,0.25)"; g.fillRect(0, i * 32 + 30, w, 2); g.fillRect((i * 97) % w, i * 32, 2, 30); } }, [8, 8]);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ map: wood, roughness: 0.75 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; cafe.add(floor);
const wallM = new THREE.MeshStandardMaterial({ color: 0x2c6fb8, roughness: 0.85 });
const wallBack = new THREE.Mesh(new THREE.BoxGeometry(16, 4, 0.3), wallM); wallBack.position.set(0, 2, -3.2); wallBack.receiveShadow = true; cafe.add(wallBack);
const wallL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4, 16), wallM); wallL.position.set(-5, 2, 1); wallL.receiveShadow = true; cafe.add(wallL);
const wallR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4, 16), wallM); wallR.position.set(5, 2, 1); wallR.receiveShadow = true; cafe.add(wallR);
const brick = canvasTex(256, 256, (g, w, h) => { g.fillStyle = "#b5653f"; g.fillRect(0, 0, w, h); g.fillStyle = "#8f4a2c"; for (let y = 0; y < 8; y++) for (let x = 0; x < 5; x++) g.fillRect(x * 56 + (y % 2) * 28 - 4, y * 32 + 2, 52, 28); }, [6, 2]);
const brickWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 4), new THREE.MeshStandardMaterial({ map: brick, roughness: 0.95 })); brickWall.position.set(-1.5, 2, -3.04); cafe.add(brickWall);
// windows (glowing, a city outside)
for (const x of [2.2, 3.7]) { const w = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.8), new THREE.MeshBasicMaterial({ color: 0x9fd4ff })); w.position.set(x, 2.0, -3.04); cafe.add(w); const f = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.9, 0.05), new THREE.MeshStandardMaterial({ color: 0x1b1b1b })); f.position.set(x, 2.0, -3.06); cafe.add(f); }
// posters
const poster = (col, txt) => canvasTex(256, 360, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, col); gr.addColorStop(1, "#111"); g.fillStyle = gr; g.fillRect(0, 0, w, h); g.fillStyle = "#fff"; g.font = "900 46px D"; g.textAlign = "center"; g.fillText(txt, w / 2, h - 40); g.beginPath(); g.arc(w / 2, 140, 70, 0, 6.28); g.fillStyle = "rgba(255,255,255,0.85)"; g.fill(); });
[[-4.84, 1.9, -0.6, "#ff7a3c", "COFFEE"], [-4.84, 1.9, 1.4, "#3ccfff", "JAZZ"]].forEach(([x, y, z, c, t]) => { const p = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.26), new THREE.MeshStandardMaterial({ map: poster(c, t) })); p.position.set(x, y, z); p.rotation.y = Math.PI / 2; cafe.add(p); });
// counter
const counter = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.05, 0.7), new THREE.MeshStandardMaterial({ color: 0x3a2a20, roughness: 0.5 })); counter.position.set(2.6, 0.525, -2.4); counter.castShadow = counter.receiveShadow = true; cafe.add(counter);
const ctop = new THREE.Mesh(new THREE.BoxGeometry(3.3, 0.06, 0.8), new THREE.MeshStandardMaterial({ color: 0xd9d4cc, roughness: 0.3 })); ctop.position.set(2.6, 1.08, -2.4); cafe.add(ctop);
// tables
function table(x, z) { const g = new THREE.Group(); const top = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.05, 40), new THREE.MeshStandardMaterial({ color: 0xe8e2d8, roughness: 0.35 })); top.position.y = 1.02; const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.0, 12), new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.6, roughness: 0.4 })); leg.position.y = 0.5; const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.03, 24), leg.material); foot.position.y = 0.015; [top, leg, foot].forEach((m) => { m.castShadow = m.receiveShadow = true; g.add(m); }); g.position.set(x, 0, z); cafe.add(g); return g; }
table(0, 0); table(-2.8, -1.6); table(2.9, 1.6); table(-2.7, 2.4);
// cups on our table
for (const x of [-0.18, 0.2]) { const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.035, 0.1, 20), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 })); cup.position.set(x, 1.1, 0.12); cup.castShadow = true; cafe.add(cup); }
// pendant lamps
for (const [x, z] of [[0, 0], [-2.8, -1.6], [2.9, 1.6]]) { const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 1.5), new THREE.MeshBasicMaterial({ color: 0x111111 })); cord.position.set(x, 3.25, z); cafe.add(cord); const shade = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.22, 24, 1, true), new THREE.MeshStandardMaterial({ color: 0x1f1f1f, side: THREE.DoubleSide })); shade.position.set(x, 2.45, z); cafe.add(shade); const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffe1a8 })); bulb.position.set(x, 2.36, z); cafe.add(bulb); }
// lights
const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x4a2a18, 1.0); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffeedd, 2.3); sun.position.set(3, 7, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 20 }); sun.shadow.bias = -0.0004; scene.add(sun);
const warm = new THREE.PointLight(0xffc98a, 6, 6, 1.6); warm.position.set(0, 2.3, 0); cafe.add(warm);

// ---------- people ----------
const SCREEN_W = 390, SCREEN_H = 844;
function makePhone() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.155, 0.009), new THREE.MeshStandardMaterial({ color: 0x15161a, roughness: 0.25, metalness: 0.5 }));
  g.add(body);
  const c = document.createElement("canvas"); c.width = SCREEN_W; c.height = SCREEN_H;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.069, 0.149), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
  scr.position.z = 0.0047; g.add(scr);
  const glow = new THREE.PointLight(0x9fd8ff, 0.25, 0.6, 2); glow.position.z = 0.06; g.add(glow);
  return { g, c, ctx: c.getContext("2d"), tex, scr, state: null };
}
const people = [];
// stick people: a ball head and thin rounded limbs, rebuilt from joint points every frame (no skeleton, renders fast)
const UP = V(0, 1, 0), tmpQ = new THREE.Quaternion();
function limb(r, m) { const g = new THREE.Mesh(new THREE.CapsuleGeometry(r, 1, 4, 10), m); g.castShadow = true; g.receiveShadow = true; return g; }
function place(mesh, a, b, r) { const d = b.clone().sub(a), L = d.length(); mesh.position.copy(a).add(b).multiplyScalar(0.5); mesh.quaternion.copy(tmpQ.setFromUnitVectors(UP, d.normalize())); mesh.scale.set(1, Math.max(0.01, L), 1); }
function person(x, z, ry, tint, opt = {}) {
  const o = new THREE.Group(); o.position.set(x, 0, z); o.rotation.y = ry;
  const m = new THREE.MeshStandardMaterial({ color: tint, roughness: 0.55 });
  const parts = {};
  for (const n of ["spine", "lArm", "lFore", "rArm", "rFore", "lLeg", "rLeg", "neck"]) { parts[n] = limb(0.028, m); o.add(parts[n]); }
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 32, 20), m); head.castShadow = true; o.add(head);
  const hips = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 12), m); o.add(hips);
  const lh = new THREE.Mesh(new THREE.SphereGeometry(0.034, 12, 10), m), rh = lh.clone(); o.add(lh, rh);
  (opt.parent || cafe).add(o);
  const nodes = { Head: head, LeftHand: lh, RightHand: rh };
  const p = { o, parts, head, hips, lh, rh, phone: makePhone(), look: opt.look ?? 0.55, off: rnd() * 3, phoneOn: opt.phone !== false, hand: opt.hand || 1.12, B: (n) => nodes[n] };
  if (p.phoneOn) (opt.parent || cafe).add(p.phone.g);
  p.screen = opt.screen || "many";
  people.push(p); return p;
}
const YOU = person(-0.62, 0.02, Math.PI / 2, 0x4fc3bd, { screen: "photo" });
const FRIEND = person(0.62, -0.02, -Math.PI / 2, 0xf08a5d, { screen: "empty" });
seed = 21;
const crowdSpots = [[-2.8, -0.9, 0.3], [-3.4, -2.0, 1.2], [-2.2, -2.2, -0.4], [2.4, 1.0, -1.9], [3.4, 2.2, -2.6], [2.2, 2.3, 2.5], [-2.2, 2.8, 2.2], [-3.3, 1.9, 0.9], [1.6, -1.4, -0.4], [3.6, -1.2, -1.2], [-0.6, 2.9, 3.0], [0.9, 3.4, 2.8]];
const tints = [0xc9ced6, 0xa7b0bd, 0xe0c6a8, 0x8fa8c8, 0xd6a3a3, 0xb7d4a8, 0xc9b6e0, 0xe8d39a];
const crowd = crowdSpots.map(([x, z, ry], i) => person(x, z, ry, tints[i % tints.length], { screen: i % 3 === 0 ? "one" : "many", look: 0.4 + rnd() * 0.3 }));

function posePerson(p, t) {
  const br = Math.sin((t + p.off) * 1.6) * 0.008, sway = Math.sin((t + p.off) * 0.7) * 0.012;
  const P = p.parts, h = p.hand;
  const hip = V(sway, 0.95, 0), neck = V(sway * 1.4, 1.43 + br, 0.02);
  const lookK = p.look;
  const headC = V(sway * 1.5, 1.6 + br - lookK * 0.03, 0.03 + lookK * 0.07);
  place(P.spine, hip, neck); place(P.neck, neck, headC.clone().lerp(neck, 0.4));
  p.head.position.copy(headC); p.hips.position.copy(hip);
  for (const sd of [-1, 1]) {
    const sh = V(sd * 0.17 + sway, 1.38 + br, 0.02), el = V(sd * 0.2, 1.1, 0.12), hd = V(sd * 0.06, h + (sd < 0 ? 0 : -0.01), 0.3);

  if (p.phoneOn) {
    const mid = p.rh.getWorldPosition(V()).add(p.lh.getWorldPosition(V())).multiplyScalar(0.5);
    const fwd = V(Math.sin(p.o.rotation.y), 0, Math.cos(p.o.rotation.y));
    p.phone.g.position.copy(mid).add(V(0, 0.07, 0)).add(fwd.multiplyScalar(0.02));
    p.phone.g.lookAt(p.head.getWorldPosition(V()));

}
// what each phone shows: image keys, crossfades and the tap ripple, drawn into its screen texture
function screen(p, draw) {
  const c = p.phone.ctx;
  const key = JSON.stringify(draw);
  if (p.phone.state === key) return;
  p.phone.state = key;
  c.fillStyle = "#000"; c.fillRect(0, 0, SCREEN_W, SCREEN_H);
  const put = (im, a = 1) => { c.globalAlpha = a; if (im === IM.photo) { c.fillStyle = "#000"; c.fillRect(0, 0, SCREEN_W, SCREEN_H); const s = SCREEN_W / im.width; c.drawImage(im, 0, (SCREEN_H - im.height * s) / 2 - 40, SCREEN_W, im.height * s); c.fillStyle = "#fff"; c.font = "600 22px Inter, Arial"; c.fillText("Photos", 20, 60); } else c.drawImage(im, 0, 0, SCREEN_W, SCREEN_H); c.globalAlpha = 1; };

// ---------- world 2: the city (seen from above) ----------
const city = new THREE.Group(); scene.add(city); // shares the origin with the café; only one is visible at a time
const CELL = 60, GRID = 9; // 9 × 9 cells around us; ours is the middle one
const ground = new THREE.Mesh(new THREE.PlaneGeometry(CELL * GRID * 1.6, CELL * GRID * 1.6), new THREE.MeshStandardMaterial({ color: 0x1b2433, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; city.add(ground);
const winTex = canvasTex(64, 128, (g, w, h) => { g.fillStyle = "#2a3346"; g.fillRect(0, 0, w, h); for (let y = 6; y < h; y += 12) for (let x = 6; x < w; x += 12) { g.fillStyle = Math.random() < 0.45 ? "#ffd98a" : "#1a2130"; g.fillRect(x, y, 6, 7); } });
const bMat = new THREE.MeshStandardMaterial({ map: winTex, roughness: 0.8, emissive: 0xffd98a, emissiveMap: winTex, emissiveIntensity: 0.35 });
const roofMat = new THREE.MeshStandardMaterial({ color: 0x39455c, roughness: 0.9 });
seed = 77;
const span = CELL * GRID;
const bGeo = new THREE.BoxGeometry(1, 1, 1);
const blocks = new THREE.InstancedMesh(bGeo, [bMat, bMat, roofMat, roofMat, bMat, bMat], 2600);
let bi = 0; const m4 = new THREE.Matrix4();
for (let gx = -span / 2; gx < span / 2; gx += 12) for (let gz = -span / 2; gz < span / 2; gz += 12) {
  if (bi >= 2600) break;
  if (Math.abs(gx % 48) < 1 || Math.abs(gz % 48) < 1) continue; // avenues
  const h = 3 + Math.pow(rnd(), 2.4) * (Math.hypot(gx, gz) < 120 ? 34 : 18);
  m4.compose(V(gx + 6, h / 2, gz + 6), new THREE.Quaternion(), V(8 + rnd() * 2, h, 8 + rnd() * 2));
  blocks.setMatrixAt(bi++, m4);
}
blocks.count = bi; blocks.castShadow = blocks.receiveShadow = true; city.add(blocks);
// the grid of cells
