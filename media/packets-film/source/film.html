  const bk = prog(t, fr("near", 0.62), fr("near", 0.85)), gone = prog(t, fr("near", 0.85), fr("near", 0.95));

  for (let i = 0; i < EMN; i++) { const d = emberDir[i]; emberPos.set([d[0] * out(gone) * 2, 2.2 + d[1] * out(gone) * 2 - gone * gone, d[2] * out(gone) * 2], i * 3); }
