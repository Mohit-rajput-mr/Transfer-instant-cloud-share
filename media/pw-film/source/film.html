    card("c0", `<h5>out comes</h5><span style="font-size:26px">${HX.sunflower7.slice(0, 32)}<br/>${HX.sunflower7.slice(32)}</span>`, t, A("blend") + span * 0.55, A("same"), 70, 300, -1);
    tag("tA", t, A("blend") + 0.5, A("same"), 540, 160);
  } else if (t < A("oneway")) {
    const span = A("oneway") - A("same"), k = ease(clamp((t - A("same")) / span));
    look(lerp(-1.0, 1.0, k), 2.2, 4.4, 0, 1.4, 0, 44);
    drop(word('"sunflower7"'), t, A("same") + 0.2, 0.8); drop(word('"sunflower8"', "#ffd23d"), t, A("same") + span * 0.55, 0.8);
    card("c0", `${QW("sunflower7")} → ${short(HX.sunflower7)}`, t, A("same") + 0.6, A("oneway"), 60, 260, -1);
    card("c1", `${QW("sunflower7")} → ${short(HX.sunflower7)}`, t, A("same") + 1.4, A("oneway"), 60, 400, 1);
    card("c2", `${QW("sunflower<span class='red'>8</span>")} → <span class="red">${short(HX.sunflower8)}</span>`, t, A("same") + span * 0.6, A("oneway"), 60, 560, -1);
  } else if (t < A("login")) {
    const span = A("login") - A("oneway"), k = ease(clamp((t - A("oneway")) / span));
    look(lerp(1.6, 1.0, k), lerp(2.0, 2.6, k), lerp(3.6, 4.6, k), 0, 1.2, 0, 44);
    FRUIT.forEach((m, i) => { const kk = clamp((t - A("oneway") - 0.2 - i * 0.25) / 0.7); if (kk <= 0 || kk >= 1) return; m.visible = true; m.position.set((i - 1) * 0.2, lerp(3.2, 1.0, kk * kk), 0); m.rotation.set(t * 3, t * 2, 0); });

    if (t > bk) { backArrow.visible = true; backArrow.position.set(1.6, 1.6, 0.3); xMark.visible = t > bk + 0.6; xMark.position.set(1.6, 1.6, 0.4); xMark.scale.setScalar(back(clamp((t - bk - 0.6) / 0.3))); }
    tag("tB", t, bk, A("login"), 540, 160);
  } else if (t < A("salt")) {
    const span = A("salt") - A("login"), k = ease(clamp((t - A("login")) / span));
    look(lerp(-4.2, -3.6, k), lerp(2.4, 2.2, k), lerp(4.2, 3.6, k), -0.8, 1.4, 0.4, 44);
    drop(word('"sunflower7"', "#4fc3bd"), t, A("login") + 0.4, 0.9);
    card("c0", `<h5>saved by the site</h5>${short(HX.sunflower7)}`, t, A("login") + 1.2, A("salt"), 80, 260, -1);
    card("c1", `<h5>you typed → blended</h5>${short(HX.sunflower7)}`, t, A("login") + 2.0, A("salt"), 80, 470, 1);
    const m0 = A("login") + span * 0.45; if (t > m0) S($("shout2"), { opacity: clamp((t - m0) / 0.15), transform: `scale(${lerp(1.7, 1, back(clamp((t - m0) / 0.25)))}) rotate(-3deg)`, top: "760px" });
  } else if (t < A("leak")) {
    const span = A("leak") - A("salt"), k = ease(clamp((t - A("salt")) / span));
    look(lerp(0.8, 0.4, k), lerp(3.2, 2.8, k), lerp(3.6, 3.2, k), 0, 1.6, 0, 44);
    shaker.visible = true; shaker.position.set(0.15, 2.9 + Math.sin(t * 14) * 0.05, 0); shaker.rotation.z = 2.6;
    grains.forEach((m, i) => { const kk = ((t * 1.3 + i / 40) % 1); m.visible = true; m.position.set(0.05 + Math.sin(i) * 0.08, 2.75 - kk * 1.6, Math.cos(i * 3) * 0.08); });
    card("c0", `<h5>ana</h5>sunflower7 + salt <b>x7Qp</b><br/>→ ${short(HX.sunflower7x7Qp)}`, t, A("salt") + span * 0.4, A("leak"), 50, 230, -1);
    card("c1", `<h5>ben</h5>sunflower7 + salt <b>M2kz</b><br/>→ <span class="red">${short(HX.sunflower7M2kz)}</span>`, t, A("salt") + span * 0.58, A("leak"), 50, 480, 1);
    tag("tC", t, A("salt") + 0.5, A("leak"), 540, 140);
  } else if (t < A("guess")) {
    const span = A("guess") - A("leak"), k = ease(clamp((t - A("leak")) / span));
    look(lerp(1.2, 1.6, k), lerp(2.6, 2.2, k), lerp(5.2, 5.6, k), lerp(4.2, 3.0, k), 1.4, lerp(-2.0, 0, k), 46);
    drawHex(t, false);
    list.visible = true; const lk = ease(clamp((t - A("leak") - 1.0) / 1.6)); list.position.copy(V(4.5, 1.8, -2.3).lerp(V(2.75, 1.25, 0.35), lk));
    THIEF.o.position.set(lerp(3.6, 2.6, lk), 0, lerp(-1.4, 1.0, lk));
    S($("red"), { opacity: 0.35 });
    tag("tD", t, A("leak") + span * 0.6, A("guess"), 540, 160);
  } else if (t < A("slow")) {
    const span = A("slow") - A("guess"), k = ease(clamp((t - A("guess")) / span));
    look(lerp(2.6, 1.6, k), 2.4, lerp(4.6, 4.0, k), 0.6, 1.4, 0, 44);
    list.visible = true; list.position.set(2.75, 1.25, 0.35);
    const ws = ["123456", "password", "qwerty", "123456"];
    ws.forEach((w, i) => drop(word(`"${w}"`, "#ff8a8a"), t, A("guess") + 0.3 + i * span * 0.2, 0.7));
    card("c0", `"123456" → ${short(HX["123456"])} <span class="red">MATCH</span>`, t, A("guess") + span * 0.45, A("slow"), 40, 300, -1);
    card("c1", `"password" → ${short(HX.password)}`, t, A("guess") + span * 0.62, A("slow"), 40, 440, 1);
    card("c2", `"qwerty" → ${short(HX.qwerty)}`, t, A("guess") + span * 0.78, A("slow"), 40, 580, -1);
  } else if (t < A("orbi")) {
    const span = A("orbi") - A("slow"), k = ease(clamp((t - A("slow")) / span));
    look(lerp(0.2, 0.1, k), lerp(1.4, 1.2, k), lerp(2.6, 2.0, k), 0, 0.9, 0, 40);
    tag("tE", t, A("slow") + 0.3, A("orbi"), 540, 160);
    card("c0", `<h5>if one try takes 0.3 s</h5>1 login · <b>a blink</b>`, t, A("slow") + span * 0.35, A("orbi"), 120, 300, -1);
    card("c1", `<h5>1,000,000 guesses</h5>≈ <b>3.5 days</b>`, t, A("slow") + span * 0.62, A("orbi"), 120, 520, 1);
  } else if (t < A("rounds")) {
    const span = A("rounds") - A("orbi"), k = ease(clamp((t - A("orbi")) / span));
    look(lerp(-3.4, -3.0, k), lerp(2.0, 1.9, k), lerp(3.4, 2.9, k), -2.1, 1.45, 1.1, 40);
    keyS.visible = true; keyS.position.set(-1.9, 1.45 + Math.sin(t * 3) * 0.04, 1.5);
    tag("tF", t, A("orbi") + 0.6, A("rounds"), 540, 160);
  } else if (t < A("tries")) {
    const span = A("tries") - A("rounds"), k = ease(clamp((t - A("rounds")) / span));
    look(lerp(1.0, 2.2, k), lerp(2.6, 3.4, k), lerp(5.5, 8.0, k), lerp(0, 2.4, k), 1.8, lerp(0, -1.4, k), 48);
    const n = Math.round(310000 * ease(clamp((t - A("rounds") - 0.3) / (span * 0.45))));
    $("timer").textContent = n.toLocaleString("en-US"); S($("timer"), { opacity: win(t, A("rounds") + 0.2, A("rounds") + span * 0.6, 0.2, 0.3), color: "#3dff8c", fontSize: "130px" });
    const fk = ease(clamp((t - A("rounds") - span * 0.5) / (span * 0.35))); fp.visible = t > A("rounds") + span * 0.45; fp.position.copy(V(0, 2.6, 0).lerp(V(4.5, 3.6, -2.4), fk));
    drawHex(t, t > A("rounds") + span * 0.85);
    tag("tG", t, A("rounds") + 0.3, A("tries"), 540, 160);
  } else {
    const k = ease(clamp((t - A("tries")) / 3));
    look(lerp(3.4, 3.8, k), 2.3, lerp(3.2, 3.8, k), 4.5, 1.8, -2.6, 44);
    drawHex(t, true);
    const tk = clamp((t - A("tries") - 0.3) / (L.tries.dur * 0.8)), n = Math.min(12, Math.floor(tk * 12) + 1);
    $("tries").innerHTML = n < 12 ? `wrong try ${n}/12` : `12/12 · <b>LOCKED</b>`; S($("tries"), { opacity: win(t, A("tries") + 0.2, A("end"), 0.2, 0.2) });
  }

  // ---- subtitles: 1–3 words, timed to the voice ----
  let sub = "";
  for (const ln of LINES.lines) {
    if (t < ln.at - 0.05 || t > ln.at + ln.dur + 0.1) continue;
    const words = ln.text.split(" "), total = words.reduce((s, w) => s + w.length + 2, 0);
    let acc = 0; const stt = words.map((w) => { const s = ln.at + (acc / total) * ln.dur; acc += w.length + 2; return s; });
    let cur = 0; for (let i = 0; i < words.length; i++) if (t >= stt[i]) cur = i;
    const chunksW = []; let c = [];
    words.forEach((w, i) => { c.push(i); if (c.length === 3 || /[.,?!:]$/.test(w)) { chunksW.push(c); c = []; } }); if (c.length) chunksW.push(c);
    sub = chunksW.find((cc) => cc.includes(cur)).map((i) => words[i]).join(" ");
  }
  $("sub").textContent = sub;
  S($("sub"), { opacity: t > A("end") - 0.1 ? 0 : 1 });
  const e = clamp((t - A("end") + 0.1) / 0.45);
  S($("endc"), { opacity: e });
  document.querySelector("#endc .em").style.transform = `rotate(${(t - A("end")) * 25}deg) scale(${lerp(0.6, 1, back(e))})`;
  S($("fade"), { opacity: Math.max(1 - clamp(t / 0.3), clamp((t - (window.DURATION - 0.5)) / 0.5)) });
  r.render(scene, cam);
};
await document.fonts.ready;
window.ready = true;
