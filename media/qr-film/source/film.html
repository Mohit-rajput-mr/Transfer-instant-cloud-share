<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>How a QR code works</title>
<style>
  @font-face { font-family: "D"; src: url(fonts/archivo.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "M"; src: url(fonts/jetbrains.woff2) format("woff2"); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; color: #fff; }
  canvas#gl { position: absolute; left: 0; top: 0; }
  .ov { position: absolute; z-index: 20; pointer-events: none; }
  #sub { left: 40px; right: 40px; top: 1190px; text-align: center; font: 800 70px/1.15 "D"; font-stretch: 100%; color: #fff;
    -webkit-text-stroke: 3px #000; paint-order: stroke fill; text-shadow: 0 4px 10px rgba(0,0,0,0.65); z-index: 40; }
  .tag { padding: 16px 26px; border-radius: 16px; background: rgba(10,12,16,0.85); border: 2px solid rgba(255,255,255,0.25); font: 700 46px/1 "M"; letter-spacing: 0.04em; text-transform: uppercase; color: #eaf0f5; white-space: nowrap; opacity: 0; }
  .tag b { color: #ffd23d; font-weight: 700; }
  .big { left: 0; right: 0; top: 1420px; text-align: center; font: 900 110px/1 "M"; color: #ffd23d; -webkit-text-stroke: 4px #000; paint-order: stroke fill; opacity: 0; }
  #res { left: 50%; top: 1460px; transform: translateX(-50%); padding: 26px 44px; border-radius: 30px; background: #fff; color: #111; font: 900 58px/1 "D"; font-stretch: 110%; white-space: nowrap; box-shadow: 0 20px 60px rgba(0,0,0,0.5); opacity: 0; }
  #res i { color: #2fbf5b; font-style: normal; margin-right: 18px; }
  #endc { inset: 0; opacity: 0; background: radial-gradient(120% 80% at 50% 40%, #1d1a10, #000 70%); text-align: center; z-index: 50; }
  #endc h1 { position: absolute; left: 60px; right: 60px; top: 640px; font: 900 128px/1.02 "D"; font-stretch: 120%; text-transform: uppercase; }
  #endc p { position: absolute; left: 0; right: 0; top: 1080px; font: 700 44px/1 "M"; letter-spacing: 0.12em; text-transform: uppercase; color: #ffd23d; }
  #flash { inset: 0; background: #fff; opacity: 0; z-index: 45; }
  #fade { inset: 0; background: #000; opacity: 1; z-index: 60; }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
</head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
<div class="ov tag" id="tO">1994 · <b>Japan</b> · car parts</div>
<div class="ov tag" id="tF">Finders: <b>where · size · up</b></div>
<div class="ov tag" id="tG">Dark = <b>1</b> · Light = <b>0</b></div>
<div class="ov tag" id="tZ">Start: <b>bottom right</b></div>
<div class="ov tag" id="tM">1 of <b>8 masks</b></div>
<div class="ov tag" id="tR">Up to <b>30%</b> rebuilt</div>
<div class="ov tag" id="tB">Over <b>7,000 digits</b></div>
<div class="ov big" id="bigc"></div>
<div class="ov" id="res"><i>✓</i>NOW YOU KNOW</div>
<div class="ov" id="sub"></div>
<div class="ov" id="endc"><h1>How a QR code works</h1><p>Now you know</p></div>
<div class="ov" id="flash"></div>
<div class="ov" id="fade"></div>
<script type="module">
import * as THREE from "three";

const W = 1080, H = 1920;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const out = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

const LINES = (await (await fetch("vo/lines.json")).json());
const L = Object.fromEntries(LINES.lines.map((l) => [l.key, l]));
const at = (k) => L[k].at;
window.DURATION = LINES.duration;
// a real QR code ("NOW YOU KNOW", error correction H, version 2: 25×25), its reading order and a decodable stain (qrmake.cjs)
const QRD = await (await fetch("qr.json")).json();
const N = QRD.n, QZ = 4, CELLS = N + 2 * QZ;
const isRes = (i) => QRD.res[i] === 1;
const maskBit = (r, c) => r % 2 === 0; // mask pattern 1: every even row is flipped

const r = new THREE.WebGLRenderer({ canvas: $("gl"), antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(W, H, false);
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.1; r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(42, W / H, 0.02, 4000);
function canvasTex(w, h, draw, rep) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); }
  t.anisotropy = 4; return t;
}
const sh = (m) => { m.castShadow = m.receiveShadow = true; return m; };
const flat = (col, o = {}) => new THREE.MeshStandardMaterial({ color: col, roughness: 0.6, flatShading: true, ...o });

// ---------- the poster: the QR code, redrawn each frame with whatever is being explained ----------
const PC = document.createElement("canvas"); PC.width = PC.height = 1056;
const posterTex = new THREE.CanvasTexture(PC); posterTex.colorSpace = THREE.SRGBColorSpace; posterTex.anisotropy = 8;
const CS = PC.width / CELLS;
function cellXY(i) { const rr = Math.floor(i / N), cc = i % N; return [(cc + QZ) * CS, (rr + QZ) * CS, rr, cc]; }
function blob(g, cx, cy, R, k) { g.beginPath(); for (let a = 0; a <= 6.3; a += 0.05) { const rr = R * (1 + 0.18 * Math.sin(a * 5 + 1) + 0.1 * Math.sin(a * 9)); const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr * 0.82; a === 0 ? g.moveTo(x, y) : g.lineTo(x, y); } g.closePath(); g.fill(); }
function drawPoster(st) {
  const g = PC.getContext("2d");
  g.fillStyle = "#fdfaf2"; g.fillRect(0, 0, PC.width, PC.height);
  if (st.dense) { // the biggest code: 177 × 177
    const n2 = 177, cs = PC.width / (n2 + 8); seed = 5; g.fillStyle = "#111";
    for (let rr = 0; rr < n2; rr++) for (let cc = 0; cc < n2; cc++) if (rnd() < 0.5) g.fillRect((cc + 4) * cs, (rr + 4) * cs, cs + 0.3, cs + 0.3);
    for (const [fr, fc] of [[0, 0], [0, n2 - 7], [n2 - 7, 0]]) { g.fillStyle = "#fdfaf2"; g.fillRect((fc + 3) * cs, (fr + 3) * cs, 9 * cs, 9 * cs); g.fillStyle = "#111"; g.fillRect((fc + 4) * cs, (fr + 4) * cs, 7 * cs, 7 * cs); g.fillStyle = "#fdfaf2"; g.fillRect((fc + 5) * cs, (fr + 5) * cs, 5 * cs, 5 * cs); g.fillStyle = "#111"; g.fillRect((fc + 6) * cs, (fr + 6) * cs, 3 * cs, 3 * cs); }
    posterTex.needsUpdate = true; return; }
  for (let i = 0; i < N * N; i++) {
    const [x, y, rr, cc] = cellXY(i);
    let dark = QRD.data[i] === 1;
    if (st.unmask !== undefined && !isRes(i)) { const masked = dark; const raw = maskBit(rr, cc) ? !masked : masked; const swept = (rr + cc) / (2 * N) < st.unmask; dark = swept ? masked : raw; }
    if (dark) { g.fillStyle = "#111"; g.fillRect(x - 0.3, y - 0.3, CS + 0.6, CS + 0.6); }
    if (st.visit && st.visitSet.has(i)) { g.fillStyle = dark ? "rgba(255,210,61,0.55)" : "rgba(255,210,61,0.5)"; g.fillRect(x, y, CS, CS); }
    if (st.bits && !isRes(i) && st.bits > ((rr + cc) / (2 * N))) { g.fillStyle = dark ? "#ffd23d" : "#c9a300"; g.font = `800 ${CS * 0.62}px M`; g.textAlign = "center"; g.fillText(dark ? "1" : "0", x + CS / 2, y + CS * 0.72); }
  }
  if (st.grid) { g.strokeStyle = `rgba(80,140,255,${0.5 * st.grid})`; g.lineWidth = 2; for (let k = 0; k <= N; k++) { g.beginPath(); g.moveTo((QZ + k) * CS, QZ * CS); g.lineTo((QZ + k) * CS, (QZ + N) * CS); g.stroke(); g.beginPath(); g.moveTo(QZ * CS, (QZ + k) * CS); g.lineTo((QZ + N) * CS, (QZ + k) * CS); g.stroke(); } }
  if (st.finder) { for (const [fr, fc] of [[0, 0], [0, N - 7], [N - 7, 0]]) { const p = 0.5 + 0.5 * Math.sin(st.t * 8); g.strokeStyle = `rgba(61,255,140,${0.6 + 0.4 * p})`; g.lineWidth = 10; g.strokeRect((fc + QZ - 0.4) * CS, (fr + QZ - 0.4) * CS, 7.8 * CS, 7.8 * CS); } }
  if (st.path) { const k = st.path, m = Math.floor(QRD.order.length * k); g.strokeStyle = "#ff3dbb"; g.lineWidth = 7; g.lineJoin = "round"; g.beginPath(); for (let j = 0; j <= m && j < QRD.order.length; j++) { const [x, y] = cellXY(QRD.order[j]); j ? g.lineTo(x + CS / 2, y + CS / 2) : g.moveTo(x + CS / 2, y + CS / 2); } g.stroke(); const [hx, hy] = cellXY(QRD.order[Math.min(m, QRD.order.length - 1)]); g.fillStyle = "#ff3dbb"; g.beginPath(); g.arc(hx + CS / 2, hy + CS / 2, CS * 0.45, 0, 6.28); g.fill(); }
  if (st.stain) { const cx = (QZ + N * 0.62) * CS, cy = (QZ + N * 0.66) * CS, R = N * 0.22 * 1.18 * CS; g.globalAlpha = 0.93 * st.stain; g.fillStyle = "#6b3d1e"; blob(g, cx, cy, R * Math.min(1, st.stain * 1.3), 0); g.fillStyle = "#4a2810"; blob(g, cx + R * 0.15, cy - R * 0.1, R * 0.55 * Math.min(1, st.stain * 1.3), 0); for (let d = 0; d < 5; d++) g.fillRect(cx - R * 0.6 + d * R * 0.3, cy + R * 0.7, CS * 0.4, R * (0.3 + (d % 3) * 0.25) * st.stain); g.globalAlpha = 1; }
  if (st.rebuild) { for (const i of stainSet) { const [x, y] = cellXY(i); const k = clamp(st.rebuild * 1.6 - ((i * 37) % 100) / 100 * 0.6); if (k <= 0) continue; g.fillStyle = QRD.data[i] ? `rgba(17,17,17,${k})` : `rgba(253,250,242,${k})`; g.fillRect(x, y, CS, CS); g.strokeStyle = `rgba(61,255,140,${(1 - k) * 0.9 + 0.1})`; g.lineWidth = 3; g.strokeRect(x + 2, y + 2, CS - 4, CS - 4); } }
  posterTex.needsUpdate = true;
}

// ---------- the café table ----------
const wood = canvasTex(512, 512, (g, w, h) => { g.fillStyle = "#6e4527"; g.fillRect(0, 0, w, h); for (let i = 0; i < 90; i++) { g.strokeStyle = `rgba(${30 + (i % 3) * 20},${15 + (i % 4) * 8},5,${0.15 + (i % 5) * 0.05})`; g.lineWidth = 1 + (i % 3); g.beginPath(); const y = (i * 53) % h; g.moveTo(0, y); g.bezierCurveTo(w * 0.3, y + 10 * Math.sin(i), w * 0.7, y - 12 * Math.cos(i), w, y + 4); g.stroke(); } }, [2, 2]);
const table = new THREE.Mesh(new THREE.BoxGeometry(6, 0.12, 4), new THREE.MeshStandardMaterial({ map: wood, roughness: 0.55 })); table.position.y = -0.06; table.receiveShadow = true; scene.add(table);
const floorM = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), flat(0x2a1d14)); floorM.rotation.x = -Math.PI / 2; floorM.position.y = -2.4; scene.add(floorM);
// the printed card with the code
const card = sh(new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.012, 1.6), [flat(0xf4efe2), flat(0xf4efe2), new THREE.MeshStandardMaterial({ map: posterTex, roughness: 0.8 }), flat(0xf4efe2), flat(0xf4efe2), flat(0xf4efe2)]));
card.position.set(0, 0.006, 0); scene.add(card);
// an old barcode card next to it (the origin)
const barTex = canvasTex(512, 256, (g, w, h) => { g.fillStyle = "#fdfaf2"; g.fillRect(0, 0, w, h); seed = 3; let x = 40; while (x < w - 40) { const bw = 3 + Math.floor(rnd() * 3) * 4; if (rnd() < 0.55) { g.fillStyle = "#111"; g.fillRect(x, 30, bw, 170); } x += bw; } g.fillStyle = "#111"; g.font = "700 28px M"; g.fillText("4 901234 567894", 140, 236); });
const barcode = sh(new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.012, 0.75), [flat(0xf4efe2), flat(0xf4efe2), new THREE.MeshStandardMaterial({ map: barTex }), flat(0xf4efe2), flat(0xf4efe2), flat(0xf4efe2)]));
barcode.position.set(-1.9, 0.006, 0.2); barcode.rotation.y = 0.12; scene.add(barcode);
// a low-poly gear (a car part) beside the barcode
const gear = new THREE.Group(); { const m = flat(0x8a929c, { metalness: 0.7, roughness: 0.35 }); const hub = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.08, 18), m)); gear.add(hub); for (let i = 0; i < 10; i++) { const tth = sh(new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.08, 0.1), m)); const a = i / 10 * Math.PI * 2; tth.position.set(Math.cos(a) * 0.25, 0, Math.sin(a) * 0.25); tth.rotation.y = -a; gear.add(tth); } const hole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.09, 12), flat(0x222222)); gear.add(hole); }
gear.position.set(-2.1, 0.04, -0.75); scene.add(gear);
// the coffee cup and saucer
const cupG = new THREE.Group(); { const cer = flat(0xf3f0ea, { roughness: 0.35, flatShading: false }); const cup = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.15, 0.3, 24, 1, true), cer)); cup.position.y = 0.15; cer.side = THREE.DoubleSide; const bot = sh(new THREE.Mesh(new THREE.CircleGeometry(0.15, 24), cer)); bot.rotation.x = -Math.PI / 2; bot.position.y = 0.002; const coffee = new THREE.Mesh(new THREE.CircleGeometry(0.19, 24), flat(0x3b2010, { roughness: 0.2, flatShading: false })); coffee.rotation.x = -Math.PI / 2; coffee.position.y = 0.26; coffee.name = "coffee"; const handle = sh(new THREE.Mesh(new THREE.TorusGeometry(0.08, 0.022, 8, 16, Math.PI * 1.2), cer)); handle.position.set(0.21, 0.16, 0); handle.rotation.z = -Math.PI * 0.6; cupG.add(cup, bot, coffee, handle); }
const saucer = sh(new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.26, 0.03, 28), flat(0xf3f0ea, { roughness: 0.35, flatShading: false }))); saucer.position.set(1.35, 0.015, -0.9); scene.add(saucer);
const cupPivot = new THREE.Group(); cupPivot.position.set(1.35, 0.03, -0.9); cupPivot.add(cupG); scene.add(cupPivot);
// a splash of drops as it tips
const drops = Array.from({ length: 14 }, (_, i) => { const d = new THREE.Mesh(new THREE.SphereGeometry(0.025 + (i % 3) * 0.01, 8, 6), flat(0x4a2810, { roughness: 0.15, flatShading: false })); d.visible = false; scene.add(d); return d; });
// the phone (screen = a live camera view of the card)
const PS = document.createElement("canvas"); PS.width = 360; PS.height = 740;
const phoneTex = new THREE.CanvasTexture(PS); phoneTex.colorSpace = THREE.SRGBColorSpace;
const phone = new THREE.Group(); { const body = sh(new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.035, 0.94), flat(0x1b1d22, { metalness: 0.4, roughness: 0.3 }))); const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.88), new THREE.MeshBasicMaterial({ map: phoneTex, toneMapped: false })); scr.rotation.x = Math.PI / 2; scr.rotation.z = Math.PI; scr.position.y = 0.019; scr.rotation.set(-Math.PI / 2, 0, 0); phone.add(body, scr); }
scene.add(phone);
function drawPhone(t, ok, scanK) {
  const g = PS.getContext("2d"); g.fillStyle = "#000"; g.fillRect(0, 0, 360, 740);
  g.save(); g.translate(180, 330); g.rotate(Math.sin(t * 0.7) * 0.03); g.drawImage(PC, -150, -150, 300, 300); g.restore();
  g.strokeStyle = ok ? "#3dff8c" : "#ffd23d"; g.lineWidth = 6; const s = 300 * (ok ? 1 : 1.08 - 0.04 * Math.sin(t * 6)), x0 = 180 - s / 2, y0 = 330 - s / 2, q = 36;
  for (const [x, y, dx, dy] of [[x0, y0, 1, 1], [x0 + s, y0, -1, 1], [x0, y0 + s, 1, -1], [x0 + s, y0 + s, -1, -1]]) { g.beginPath(); g.moveTo(x, y + dy * q); g.lineTo(x, y); g.lineTo(x + dx * q, y); g.stroke(); }
  if (!ok) { const y = 330 - 150 + 300 * ((scanK * 1.5) % 1); g.fillStyle = "rgba(255,210,61,0.8)"; g.fillRect(40, y, 280, 4); }
  g.fillStyle = ok ? "#fff" : "rgba(255,255,255,0.15)"; g.beginPath(); g.roundRect(40, 560, 280, 90, 22); g.fill();
  if (ok) { g.fillStyle = "#111"; g.font = "900 30px D"; g.textAlign = "center"; g.fillText("NOW YOU KNOW", 180, 618); }
  phoneTex.needsUpdate = true;
}
// lights: warm café
scene.add(new THREE.HemisphereLight(0xfff0dc, 0x2a1a10, 0.8));
const key = new THREE.DirectionalLight(0xfff1dd, 2.2); key.position.set(2.5, 6, 3); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 20 }); key.shadow.bias = -0.0003; scene.add(key);
const warm = new THREE.PointLight(0xffb070, 6, 8, 1.5); warm.position.set(-2.5, 2.2, -1.5); scene.add(warm);
scene.background = new THREE.Color(0x140e09); scene.fog = new THREE.Fog(0x140e09, 6, 18);

function look(px, py, pz, tx, ty, tz, fov = 42) { cam.position.set(px, py, pz); cam.lookAt(tx, ty, tz); if (cam.fov !== fov) { cam.fov = fov; cam.updateProjectionMatrix(); } }
const tag = (id, t, a, b, x = 540, y = 300) => { const k = win(t, a, b, 0.3, 0.3); S($(id), { opacity: k, left: `${x}px`, top: `${y}px`, transform: `translate(-50%, ${(1 - out(clamp((t - a) / 0.3))) * 20}px)` }); };
// top-down over the card: h = height, ox/oz = focus offset, tilt = how far the camera leans back
const over = (h, ox = 0, oz = 0, tilt = 0.35, fov = 40) => look(ox, h, oz + h * tilt, ox, 0, oz - 0.05, fov);
const spill = () => at("damage") + 2.2;

window.render = async function (t) {
  for (const id of ["tO", "tF", "tG", "tZ", "tM", "tR", "tB", "bigc", "res", "flash"]) S($(id), { opacity: 0 });
  const st = { t };
  const D = at("damage"), SP = spill();

  // ---- what the code shows at this moment ----
  if (t >= at("finders") && t < at("grid")) st.finder = 1;
  if (t >= at("grid") && t < at("zigzag")) { st.grid = clamp((t - at("grid")) / 0.5); st.bits = clamp((t - at("grid") - 1.6) / 2.4) * 1.05; }
  if (t >= at("zigzag") && t < at("mask")) { st.grid = 0.5; st.path = ease(clamp((t - at("zigzag") - 0.6) / Math.max(1, at("mask") - at("zigzag") - 1.0))); }
  if (t >= at("mask") && t < D) { st.unmask = t < at("mask") + 2.2 ? 0 : ease(clamp((t - at("mask") - 2.2) / 2.2)) * 1.05; }
  if (t >= SP && t < at("big")) st.stain = clamp((t - SP) / 0.9);
  if (t >= at("repair") + 1.0 && t < at("big")) st.rebuild = clamp((t - at("repair") - 1.0) / 2.6);
  if (t >= at("big") + 2.4 && t < at("end")) st.dense = 1;
  drawPoster(st);

  // ---- the cup tips over the card ----
  const tip = clamp((t - (SP - 0.7)) / 0.7);
  cupPivot.rotation.z = t < at("big") ? ease(tip) * 1.75 : 0;
  cupPivot.rotation.y = 0.9;
  cupPivot.position.x = 1.35 - (t < at("big") ? ease(tip) * 0.25 : 0);
  cupG.getObjectByName("coffee").visible = t < SP || t >= at("big");
  drops.forEach((d, i) => { const k = (t - SP + 0.15 - i * 0.02) / 0.55; d.visible = k > 0 && k < 1 && t < at("big"); if (!d.visible) return; const a = i * 2.3; d.position.set(lerp(1.0, 0.25 + Math.cos(a) * 0.4, k), 0.35 * Math.sin(k * Math.PI) + 0.02, lerp(-0.7, 0.3 + Math.sin(a) * 0.35, k)); });

  // ---- the phone: scans at the start, and again after the spill ----
  const scanA = 0.2, okA = at("hook") + 2.6, scanB = D + 3.4, okB = at("repair") - 0.3;
  let ph = null;
  if (t < at("origin")) ph = { k: out(clamp((t - scanA) / 1.0)), ok: t > okA };
  else if (t >= scanB && t < at("repair") + 0.6) ph = { k: out(clamp((t - scanB) / 0.6)) * clamp((at("repair") + 0.6 - t) / 0.5), ok: t > okB };
  phone.visible = !!ph;
  if (ph) { phone.position.set(lerp(1.6, 0, ph.k), lerp(0.2, 1.05, ph.k), lerp(1.4, 0.15, ph.k)); phone.rotation.set(lerp(-0.6, 0, ph.k), 0, lerp(0.3, 0, ph.k)); drawPhone(t, ph.ok, t); }

  // ---- shots ----
  const A = (k) => at(k);
  if (t < A("origin")) {
    const k = ease(clamp(t / A("origin")));
    look(lerp(1.6, 0.25, k), lerp(2.6, 2.1, k), lerp(3.0, 1.7, k), 0, 0.3, 0, 40);
    if (t > okA) { const e = clamp((t - okA) / 0.3); S($("res"), { opacity: e * clamp((A("origin") - t) / 0.3), transform: `translateX(-50%) scale(${lerp(0.6, 1, back(e))})` }); }
    if (t > okA && t < okA + 0.12) S($("flash"), { opacity: 0.35 * (1 - (t - okA) / 0.12) });
  } else if (t < A("finders")) {
    const k = ease(clamp((t - A("origin")) / (A("finders") - A("origin"))));
    look(lerp(-1.6, -0.6, k), lerp(1.9, 2.6, k), lerp(1.6, 2.2, k), lerp(-1.9, -0.9, k), 0, lerp(-0.1, 0, k), 42);
    gear.rotation.y = t * 0.6;
    tag("tO", t, A("origin") + 0.4, A("finders") - 0.2, 540, 260);
  } else if (t < A("grid")) {
    const k = ease(clamp((t - A("finders")) / (A("grid") - A("finders"))));
    over(lerp(4.2, 3.8, k), 0, 0, 0.12);
    tag("tF", t, A("finders") + 2.0, A("grid") - 0.2, 540, 260);
  } else if (t < A("zigzag")) {
    const k = ease(clamp((t - A("grid")) / (A("zigzag") - A("grid"))));
    over(lerp(3.8, 1.5, k), lerp(0, 0.25, k), lerp(0, 0.2, k), 0.12, 40);
    tag("tG", t, A("grid") + 1.6, A("zigzag") - 0.2, 540, 260);
  } else if (t < A("mask")) {
    // follow the head of the zigzag
    const m = Math.min(QRD.order.length - 1, Math.floor(QRD.order.length * (st.path || 0)));
    const i = QRD.order[m], rr = Math.floor(i / N), cc = i % N, u = 1.6 / CELLS;
    const fx = (cc + QZ + 0.5) * u - 0.8, fz = (rr + QZ + 0.5) * u - 0.8;
    const k = clamp((t - A("zigzag")) / 0.8);
    over(lerp(1.5, 2.2, k), lerp(0.25, fx * 0.5, ease(k)), lerp(0.2, fz * 0.5, ease(k)), 0.12, 40);
    tag("tZ", t, A("zigzag") + 0.6, A("zigzag") + 3.6, 540, 260);
  } else if (t < D) {
    const k = ease(clamp((t - A("mask")) / (D - A("mask"))));
    over(lerp(4.0, 3.7, k), 0, 0, 0.12);
    tag("tM", t, A("mask") + 2.4, D - 0.2, 540, 260);
  } else if (t < A("repair")) {
    const k = ease(clamp((t - D) / (A("repair") - D)));
    const k2 = ease(clamp((t - SP - 1.0) / 1.6)); look(lerp(-1.6, 0.6, k2), lerp(2.4, 3.6, k2), lerp(1.3, 2.4, k2), lerp(0.6, 0.05, k2), 0.1, lerp(-0.4, 0, k2), 40);
    if (t > okB) { const e = clamp((t - okB) / 0.3); S($("res"), { opacity: e, transform: `translateX(-50%) scale(${lerp(0.6, 1, back(e))})` }); }
  } else if (t < A("big")) {
    const k = ease(clamp((t - A("repair")) / (A("big") - A("repair"))));
    if (t < A("repair") + 0.6) S($("res"), { opacity: clamp((A("repair") + 0.6 - t) / 0.4), transform: "translateX(-50%)" });
    over(lerp(3.8, 2.4, k), lerp(0, 0.15, k), lerp(0, 0.2, k), 0.12, 40);
    tag("tR", t, A("repair") + 0.5, A("big") - 0.2, 540, 260);
  } else if (t < A("end")) {
    const k = ease(clamp((t - A("big")) / (A("end") - A("big"))));
    over(lerp(4.2, 3.7, k), 0, 0, 0.1, 40);
    const n = t < A("big") + 2.4 ? 21 : Math.round(lerp(21, 177, out(clamp((t - A("big") - 2.4) / 1.6))));
    const el = $("bigc"); el.textContent = `${n} × ${n}`; S(el, { opacity: win(t, A("big") + 0.4, A("end") - 0.1, 0.3, 0.3) });
    tag("tB", t, A("big") + 4.4, A("end") - 0.1, 540, 260);
  } else {
    const k = ease(clamp((t - A("end")) / 3));
    look(lerp(1.0, 2.6, k), lerp(3.4, 3.6, k), lerp(2.6, 4.4, k), 0, 0, 0, 42);
  }
  if (t >= A("big") && t < A("big") + 2.4) { S($("bigc"), { opacity: win(t, A("big") + 0.4, A("big") + 2.4, 0.3, 0.1) }); }

  // ---- subtitles: 1–3 words, timed to the voice ----
  let sub = "";
  for (const ln of LINES.lines) {
    if (t < ln.at - 0.05 || t > ln.at + ln.dur + 0.1) continue;
    const words = ln.text.split(" "), total = words.reduce((s, w) => s + w.length + 2, 0);
    let acc = 0; const stt = words.map((w) => { const s = ln.at + (acc / total) * ln.dur; acc += w.length + 2; return s; });
    let cur = 0; for (let i = 0; i < words.length; i++) if (t >= stt[i]) cur = i;
    const chunks = []; let c = [];
    words.forEach((w, i) => { c.push(i); if (c.length === 3 || /[.,?!:]$/.test(w)) { chunks.push(c); c = []; } }); if (c.length) chunks.push(c);
    sub = chunks.find((cc) => cc.includes(cur)).map((i) => words[i]).join(" ");
  }
  $("sub").textContent = sub;
  S($("sub"), { opacity: t > A("end") + 3.2 ? 0 : 1 });

  // end card (no brand): the title over the café
  const e = clamp((t - (window.DURATION - 2.2)) / 0.5);
  S($("endc"), { opacity: e });
  S($("fade"), { opacity: Math.max(1 - clamp(t / 0.3), clamp((t - (window.DURATION - 0.4)) / 0.4)) });
  r.render(scene, cam);
};
await document.fonts.ready;
window.ready = true;
</script>
