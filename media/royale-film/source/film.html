<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>File battle royale</title>
<style>
  @font-face { font-family: "D"; src: url(fonts/archivo.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "M"; src: url(fonts/jetbrains.woff2) format("woff2"); font-weight: 100 900; }
  * { margin: 0; padding: 0; } html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; } canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// File battle royale: 10 files in a shrinking ring; the two red laser arcs cost a heart; last file standing wins. sim_27.json.
const W = 1080, H = 1920, g = document.getElementById("c").getContext("2d");
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k, back = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const SEED = 27, INTRO = 2.8;
const K = { photo: ["📸", "#2f8fff"], video: ["🎬", "#ff4a4a"], song: ["🎵", "#ff4ab4"], pdf: ["📄", "#ffb03a"], folder: ["📁", "#3dff8c"], note: ["📝", "#b48aff"], zip: ["🗜️", "#9aa8b8"], game: ["🎮", "#ff7a3c"], slides: ["📊", "#2ad4c8"], voice: ["🎤", "#ffd04a"] };
let S, EMB, END, WIN;
function text(s, x, y, size, col = "#fff", w = 900, alpha = 1, stroke = 0, font = "D", align = "center") { g.save(); g.globalAlpha = alpha; g.font = `${w} ${size}px ${font}`; g.textAlign = align; g.textBaseline = "middle"; if (stroke) { g.lineWidth = stroke; g.strokeStyle = "#000"; g.strokeText(s, x, y); } g.fillStyle = col; g.fillText(s, x, y); g.restore(); }
function ball(k, x, y, s = 1, a = 1) { const [e, c] = K[k], r = S.BR * s; g.save(); g.globalAlpha = a; g.translate(x, y); g.shadowBlur = 24; g.shadowColor = c; const rg = g.createRadialGradient(-10, -12, 3, 0, 0, r); rg.addColorStop(0, "#fff"); rg.addColorStop(0.25, c); rg.addColorStop(1, c); g.fillStyle = rg; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); g.shadowBlur = 0; g.font = `${r * 1.05}px "Noto Color Emoji"`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(e, 0, 3); g.restore(); }
function hearts(x, y, hp) { for (let i = 0; i < 3; i++) { g.save(); g.font = `24px "Noto Color Emoji"`; g.textAlign = "center"; g.globalAlpha = i < hp ? 1 : 0.25; g.fillText(i < hp ? "❤️" : "🖤", x - 28 + i * 28, y); g.restore(); } }
window.render = async function (t) {
  const lt = t - INTRO, fi = clamp(Math.round(lt * 30), 0, S.frames.length - 1), F = S.frames[fi], [aa, aw] = S.arcs[fi];
  let sh = 0; for (const e of S.events) { const d = lt - e.t; if (d < 0 || d > 0.3) continue; if (e.k === "out") sh = Math.max(sh, 22 * (1 - d / 0.3)); if (e.k === "hurt") sh = Math.max(sh, 8 * (1 - d / 0.3)); }
  g.setTransform(1, 0, 0, 1, Math.sin(t * 90) * sh, Math.cos(t * 77) * sh); g.fillStyle = "#05060b"; g.fillRect(-40, -40, W + 80, H + 80);
  // the arena: a closing danger zone outside the ring, the ring, two red laser arcs
  const rr = lt < 0 ? 470 : F.r; g.save(); g.fillStyle = "#1a080e"; g.fillRect(-40, -40, W + 80, H + 80); g.fillStyle = "#05060b"; g.beginPath(); g.arc(S.CX, S.CY, rr, 0, 7); g.fill(); g.restore();
  g.save(); g.lineWidth = 10; g.strokeStyle = "#7a5aff"; g.shadowColor = "#7a5aff"; g.shadowBlur = 24; g.beginPath(); g.arc(S.CX, S.CY, rr, 0, 7); g.stroke();
  if (lt > -0.6) { g.lineWidth = 18; g.strokeStyle = "#ff2a4a"; g.shadowColor = "#ff2a4a"; g.shadowBlur = 40; for (const c of [aa, aa + Math.PI]) { g.beginPath(); g.arc(S.CX, S.CY, rr, c - aw, c + aw); g.stroke(); } }
  g.restore();
  // bumps + hurts
  for (const e of S.events) { const d = lt - e.t; if (d < 0) continue;
    if (e.k === "bump" && d < 0.2) { g.save(); g.globalAlpha = 1 - d / 0.2; g.strokeStyle = "#fff"; g.lineWidth = 3; g.beginPath(); g.arc(e.x, e.y, 10 + d * 160, 0, 7); g.stroke(); g.restore(); }
    if (e.k === "hurt" && d < 0.5) { g.save(); g.globalAlpha = 1 - d / 0.5; g.strokeStyle = "#ff2a4a"; g.lineWidth = 6; g.beginPath(); g.arc(e.x, e.y, 46 + d * 120, 0, 7); g.stroke(); g.restore(); text("-1", e.x, e.y - 70 - d * 80, 54, "#ff4a5a", 900, 1 - d / 0.5, 6); }
    if (e.k === "out" && d < 1.4) { const col = K[e.b][1]; for (let i = 0; i < 36; i++) { const a = i * 0.5 + i, v = 200 + (i * 53) % 420; g.save(); g.globalAlpha = 1 - d / 1.4; g.fillStyle = i % 3 ? col : "#fff"; g.beginPath(); g.arc(e.x + Math.cos(a) * v * d, e.y + Math.sin(a) * v * d + 260 * d * d, 9 * (1 - d / 1.4) + 2, 0, 7); g.fill(); g.restore(); }
      const ei = S.events.indexOf(e), newer = S.events.some((o, oi) => o.k === "out" && oi > ei && o.t <= lt), k = clamp(d / 0.2); if (!newer) { g.save(); g.translate(540, 380); g.scale(lerp(2, 1, back(k)), lerp(2, 1, back(k))); text(`${e.b.toUpperCase()} IS OUT!`, 0, 0, 96, col, 900, 1 - clamp((d - 1.0) / 0.4), 10); g.restore(); } } }
  // the files
  S.KINDS.forEach((k, i) => { const [x, y, hp] = F.b[i]; if (lt >= 0 && hp <= 0) return; const yy = lt < 0 ? lerp(y - 900, y, back(clamp((lt + INTRO - 0.2 - i * 0.08) / 0.6))) : y; ball(k, x, yy); if (lt > -0.4) hearts(x, yy - 64, lt < 0 ? 3 : hp); });
  // header: survivors left
  g.setTransform(1, 0, 0, 1, 0, 0);
  const alive = lt < 0 ? 10 : F.b.filter((b) => b[2] > 0).length; text("FILE BATTLE ROYALE", 540, 120, 64, "#fff", 900); text(`${alive} LEFT`, 540, 200, 58, alive <= 2 ? "#ff4a5a" : "#ffd04a", 900, 1, 0, "M");
  const rowK = S.KINDS; rowK.forEach((k, i) => { const x = 105 + i * 97, y = 1620; const dead = lt >= 0 && F.b[i][2] <= 0; ball(k, x, y, 0.85, dead ? 0.22 : 1); if (dead) { g.save(); g.strokeStyle = "#ff4a5a"; g.lineWidth = 6; g.beginPath(); g.moveTo(x - 26, y - 26); g.lineTo(x + 26, y + 26); g.moveTo(x + 26, y - 26); g.lineTo(x - 26, y + 26); g.stroke(); g.restore(); } });
  text("red laser = −1 ❤️", 540, 1720, 38, "#ff8a9a", 700, lt > 0 && lt < 6 ? 1 : 0, 0, "M");
  if (alive === 2 && lt > 0 && lt < END - 0.5) text("FINAL 2", 540, 1500, 80, "#ff4a5a", 900, 0.6 + 0.4 * Math.sin(t * 9), 8);
  // intro
  if (t < INTRO + 0.3) { const k = clamp(t / 0.4), o = clamp((INTRO + 0.3 - t) / 0.4); g.fillStyle = `rgba(0,0,0,${0.5 * o})`; g.fillRect(0, 0, W, H); g.save(); g.translate(540, 820); g.scale(lerp(2, 1, back(k)), lerp(2, 1, back(k))); text("10 FILES. 1 SURVIVOR.", 0, 0, 84, "#fff", 900, o, 12); g.restore();
    text("Pick yours in the comments 👇", 540, 940, 52, "#ffd04a", 800, o * clamp((t - 0.7) / 0.3), 8); }
  // winner + end card
  const ae = lt - END + 0.2;
  if (ae > 0) { const k = clamp(ae / 0.4); g.fillStyle = `rgba(0,0,0,${0.78 * k})`; g.fillRect(0, 0, W, H); text("SURVIVOR", 540, 560, 130, "#ffd04a", 900, k, 12); ball(WIN, 540, 850, 3.6 * back(k) || 0.01, k); text(WIN.toUpperCase(), 540, 1130, 150, K[WIN][1], 900, k, 12);
    const e2 = clamp((ae - 2.4) / 0.6); if (e2 > 0) { g.fillStyle = `rgba(0,0,0,${e2 * 0.93})`; g.fillRect(0, 0, W, H); g.save(); g.globalAlpha = e2; g.translate(540, 760); g.rotate((ae - 2.4) * 0.4); if (EMB) g.drawImage(EMB, -130, -130, 260, 260); g.restore();
      text("ORBI TRANSFER", 540, 1010, 96, "#fff", 900, e2); text("Follow for round 2", 540, 1110, 44, "#3dff8c", 700, e2, 0, "M"); text("@orbitransfer", 540, 1200, 46, "#fff", 600, e2, 0, "M"); } }
  const fade = Math.max(1 - clamp(t / 0.3), clamp((t - (window.DURATION - 0.5)) / 0.5)); if (fade > 0) { g.fillStyle = `rgba(0,0,0,${fade})`; g.fillRect(0, 0, W, H); }
};
(async () => { S = await (await fetch(`sim_${SEED}.json`)).json(); const w = S.events.find((e) => e.k === "win"); WIN = w.b; END = w.t + 1.0; window.DURATION = INTRO + END + 5.2;
  EMB = new Image(); EMB.src = "emblem.svg"; await EMB.decode().catch(() => (EMB = null)); await document.fonts.load("900 50px D"); await document.fonts.load("700 30px M"); window.ready = true; })();
</script>
</body>
</html>
