<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Orbi Transfer · vertical film</title>
<style>
  @font-face { font-family: "Display"; src: local("Arial Black"), local("Arial"); }
  :root { --live: #3dff8c; --dim: #8d8d8d; }

  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }

  .laptop .base { position: absolute; left: -70px; top: 718px; width: 1280px; height: 26px; border-radius: 0 0 22px 22px; background: linear-gradient(#cfd3da, #8c9098 60%, #5f636b); }
  .laptop .base::before { content: ""; position: absolute; left: 50%; top: 0; width: 180px; height: 9px; margin-left: -90px; border-radius: 0 0 10px 10px; background: #6d7179; }

  .tag i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--live); margin-right: 8px; box-shadow: 0 0 10px var(--live); vertical-align: 1px; }

  /* ---------- pointer + finger ---------- */
  .cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; z-index: 30; pointer-events: none; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.55)); transform-origin: 6px 4px; }
  .ripple { position: absolute; left: 0; top: 0; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.9); z-index: 29; opacity: 0; pointer-events: none; }
  .finger { position: absolute; left: 0; top: 0; width: 120px; height: 168px; z-index: 30; pointer-events: none; transform-origin: 30px 10px; filter: drop-shadow(0 14px 18px rgba(0,0,0,0.55)); }
  .lens { position: absolute; border-radius: 22px; overflow: hidden; border: 2px solid rgba(255,255,255,0.35); box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 8px rgba(255,255,255,0.05); background-repeat: no-repeat; opacity: 0; z-index: 40; }

  /* ---------- type ---------- */
  .wide { font-family: "Archivo Black", "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; letter-spacing: 0.01em; text-transform: uppercase; }
  .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase; }
  #hook { position: absolute; left: 0; right: 0; top: 330px; text-align: center; }
  #hook .lead { font-size: 34px; color: #9a9a9a; letter-spacing: 0.02em; margin-bottom: 34px; }
  #hook .words { display: flex; justify-content: center; gap: 54px; }
  #hook .w { position: relative; font-size: 82px; }
  #hook .w b { position: absolute; left: -6%; top: 52%; height: 10px; width: 112%; background: #ff4d4d; border-radius: 6px; transform-origin: 0 50%; box-shadow: 0 0 22px rgba(255,77,77,0.6); }
  #logo { position: absolute; left: 50%; top: 50%; width: 900px; margin-left: -450px; margin-top: -70px; }
  #emblem { position: absolute; left: 50%; top: 50%; width: 170px; height: 170px; margin: -85px 0 0 -85px; }
  #meetline { position: absolute; left: 0; right: 0; top: 640px; text-align: center; font-size: 22px; color: #bdbdbd; }

  .caption { position: absolute; left: 96px; top: 64px; z-index: 50; }
  .caption .n { display: inline-block; padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25); font-size: 15px; color: #cfcfcf; margin-bottom: 16px; }
  .caption .t { font-size: 62px; line-height: 1.02; }
  .caption .s { margin-top: 14px; font-size: 18px; color: #9a9a9a; }

  #end .url { position: absolute; left: 50%; top: 560px; transform: translateX(-50%); padding: 16px 34px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.35); font-size: 30px; letter-spacing: 0.08em; }
  #end .sub { position: absolute; left: 0; right: 0; top: 660px; font-size: 18px; color: #9a9a9a; }
  #end .ph { position: absolute; left: 50%; top: 735px; transform: translateX(-50%); padding: 16px 30px; border-radius: 14px; background: #fff; color: #000; font: 800 26px/1 "Inter", Arial, sans-serif; letter-spacing: 0.01em; }
  svg#fx { position: absolute; inset: 0; z-index: 45; pointer-events: none; overflow: visible; }
  #cloud { position: absolute; z-index: 44; width: 260px; height: 178px; opacity: 0; }
  #cloudtxt { position: absolute; z-index: 44; width: 420px; text-align: center; font-size: 16px; color: #c9d6ea; opacity: 0; }
  #priya { position: absolute; z-index: 46; opacity: 0; display: flex; align-items: center; gap: 16px; padding: 18px 26px 18px 18px; transform-origin: 50% 50%; border-radius: 18px; background: rgba(22,24,30,0.92); border: 1px solid rgba(255,255,255,0.18); box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  #priya .av { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 20px; background: linear-gradient(135deg, #3fd1b1, #1b7f6e); }
  #priya b { display: block; font-size: 24px; }
  #priya span { font-size: 18px; color: #a9a9a9; }
  .fade { position: absolute; inset: 0; background: #000; z-index: 90; pointer-events: none; }
</style>
<style>

  .nope .ic { width: 78px; height: 78px; border-radius: 22px; display: grid; place-items: center; }

  .nope .x { position: absolute; right: -22px; top: -22px; width: 56px; height: 56px; border-radius: 50%; background: #ff4d4d; display: grid; place-items: center; font: 900 34px/1 Arial; transform: scale(0); }
  #big { position: absolute; left: 0; right: 0; top: 520px; z-index: 58; text-align: center; opacity: 0; }
  #big .w { display: block; font: 900 150px/1.0 "Archivo Black", "Arial Black", Arial, sans-serif; text-transform: uppercase; }
  #big .w.g { color: #3dff8c; }
  #emblem { width: 260px; height: 260px; margin: -130px 0 0 -130px; top: 760px; }
  #logo { width: 900px; margin-left: -450px; top: 960px; margin-top: 0; }
  #endc { position: absolute; inset: 0; z-index: 70; opacity: 0; text-align: center; }
  #endc img.l { position: absolute; left: 90px; top: 700px; width: 900px; }
  #endc .url { position: absolute; left: 50%; top: 880px; transform: translateX(-50%); padding: 22px 44px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.4); font: 600 44px/1 "JetBrains Mono", "DejaVu Sans Mono", monospace; letter-spacing: 0.06em; white-space: nowrap; }
  #endc .free { position: absolute; left: 0; right: 0; top: 1010px; font: 700 30px/1.4 "JetBrains Mono", "DejaVu Sans Mono", monospace; letter-spacing: 0.16em; color: #9a9a9a; text-transform: uppercase; }
  #endc .bio { position: absolute; left: 50%; top: 1170px; transform: translateX(-50%); padding: 26px 46px; border-radius: 22px; background: #3dff8c; color: #000; font: 900 52px/1 "Archivo Black", "Arial Black", Arial, sans-serif; text-transform: uppercase; white-space: nowrap; }
  #endc .arrow { position: absolute; left: 50%; top: 1290px; margin-left: -40px; width: 80px; height: 120px; }
  .tag { font-size: 26px; padding: 12px 20px; }

<body>
<div id="stage">
  <canvas id="stars" width="1080" height="1920"></canvas>
  <div class="glow" id="g1" style="left:-300px;top:-200px;width:900px;height:900px;background:#2b3cff"></div>
  <div class="glow" id="g2" style="left:400px;top:1200px;width:900px;height:900px;background:#00d39a"></div>

  <div class="dev laptop" id="lap">
    <div class="base"></div>
    <div class="lid"><div class="cam"></div><div class="screen"><img class="cap" id="lapImg" />
      <div class="ripple" id="rip"></div>
      <svg class="cursor" id="cur" viewBox="0 0 34 34"><path d="M6 3 L6 27 L12.2 21.2 L16.4 30.6 L20.6 28.8 L16.5 19.6 L25 19.6 Z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div></div>
  </div>
  <div class="dev phone" id="ph"><div class="body"></div><div class="island"></div><div class="screen"><img class="cap" id="phImg" />
    <div class="ripple" id="prip"></div>
    <svg class="finger" id="fin" viewBox="0 0 120 168"><defs><linearGradient id="sk" x1="0" x2="1"><stop offset="0" stop-color="#f3d2bd"/><stop offset="1" stop-color="#d9a98d"/></linearGradient></defs>
      <path d="M22 10 c0-9 16-9 16 0 v58 c4-6 16-6 18 2 c4-6 16-5 18 3 c5-5 16-3 17 6 v34 c0 28-16 46-44 46 c-24 0-34-12-44-30 l-16-30 c-5-9 6-16 13-9 l10 12 z" fill="url(#sk)" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/>
      <path d="M24 6 c2-3 10-3 12 0" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/></svg>
  </div></div>
  <svg id="fx" width="1080" height="1920"></svg>

  <div id="pov"><small>POV</small>You need this file on your phone.<br><span style="color:#3dff8c">Right now.</span></div>
  <div class="nope" id="n1" style="top:760px"><div class="ic" style="background:#2a6bff"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div>Email it to yourself<i></i><span class="x">✕</span></div>
  <div class="nope" id="n2" style="top:960px"><div class="ic" style="background:#e0a321"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M7 3v5M17 3v5M5 8h14v4a7 7 0 0 1-14 0z"/><path d="M12 19v3"/></svg></div>Find a cable<i></i><span class="x">✕</span></div>
  <div id="big"><span class="w" id="w1">No app.</span><span class="w" id="w2">No login.</span><span class="w g" id="w3">Free.</span></div>

  <img id="emblem" src="emblem.svg" />
  <img id="logo" src="logo.svg" />
  <div class="sub" id="sub"></div>
  <div class="tag" id="tagL"></div><div class="tag" id="tagP"></div>
  <div id="endc"><img class="l" src="logo.svg" /><div class="url">orbitransfer.com</div><div class="free">Free · no login · any device</div><div class="bio">Link in bio</div>
    <svg class="arrow" viewBox="0 0 80 120" fill="none" stroke="#3dff8c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M40 8v96M12 76l28 30 28-30"/></svg></div>
  <div class="fade" id="fade"></div>
</div>

<script>
const VO = { hook: 0.15, pain: 3.0, meet: 5.75, send: 7.35, land: 9.9, free: 12.8, team: 14.75, end: 16.95 };
window.VO = VO;
const DURATION = 21.0;
window.DURATION = DURATION;
let MARKS = {};
let LINES = {};

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const out = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const win = (t, a, b, fi = 0.25, fo = 0.25) => clamp((t - a) / fi) * clamp((b - t) / fo);
function pw(t, pts) {
  if (t <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) { const [t0, v0] = pts[i - 1], [t1, v1] = pts[i]; return v0 + ((t - t0) / (t1 - t0)) * (v1 - v0); }
  return pts[pts.length - 1][1];
}
function pwInv(f, pts) {
  for (let i = 1; i < pts.length; i++) { const [t0, v0] = pts[i - 1], [t1, v1] = pts[i]; if (f >= v0 && f <= v1 && v1 !== v0) return t0 + ((f - v0) / (v1 - v0)) * (t1 - t0); }
  return pts[pts.length - 1][0];
}
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, a] = keys[i - 1], [t1, b] = keys[i];
      const k = ease((t - t0) / (t1 - t0));
      const o = {};
      for (const key of Object.keys(b)) o[key] = lerp(a[key] ?? b[key], b[key], k);
      return o;
    }
  }
  return keys[keys.length - 1][1];
}
const mk = (shot, name) => (MARKS[shot]?.marks || []).find((m) => m.name === name) || { f: 0, x: 0, y: 0 };
const last = (shot) => (MARKS[shot]?.frames ?? 1) - 1;
const frameSrc = (shot, f) => `cap/${shot}/${String(Math.max(0, Math.min(last(shot), Math.round(f)))).padStart(5, "0")}.png`;
const $ = (id) => document.getElementById(id);
const pending = [];
function setImg(el, src) { if (el.dataset.src === src) return; el.dataset.src = src; el.src = src; pending.push(el.decode().catch(() => {})); }

const stars = [];
let seed = 3; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
for (let i = 0; i < 520; i++) stars.push({ x: rnd() * 1080, y: rnd() * 1920, r: rnd() * 1.6 + 0.3, z: rnd() * 0.8 + 0.2, tw: rnd() * 6.28 });
function drawStars(t) {
  const c = $("stars").getContext("2d");
  c.clearRect(0, 0, 1080, 1920);
  for (const s of stars) {
    const y = (s.y + t * 40 * s.z) % 1920;
    c.fillStyle = `rgba(255,255,255,${0.25 + 0.55 * s.z * (0.75 + 0.25 * Math.sin(t * 1.3 + s.tw))})`;
    c.beginPath(); c.arc(s.x, y, s.r, 0, 6.283); c.fill();
  }
}

const MAP = {
  send: () => [[6.9, 12], [7.3, mk("send", "fab").f], [7.8, mk("send", "files").f], [8.3, mk("send", "name").f], [8.9, mk("send", "send").f], [9.7, mk("send", "landed").f]],
  receive: () => [[9.4, 20], [9.9, mk("receive", "arrive").f], [10.7, mk("receive", "ball").f], [11.2, mk("receive", "download").f], [11.9, mk("receive", "ready").f], [12.3, mk("receive", "save").f], [12.6, mk("receive", "saved").f], [14.6, last("receive")]],
  roomphone: () => [[14.6, 10], [15.0, mk("roomphone", "arrive0").f], [15.7, mk("roomphone", "arrive1").f], [16.4, mk("roomphone", "arrive2").f], [17.2, last("roomphone")]],
};

// placements: laptop (lx,ly,ls,lo) · phone (px,py,ps,pr rotation,po)
const START = { lx: 85, ly: 1230, ls: 0.8, lo: 1, px: 300, py: 2100, ps: 1.4, pr: 6, po: 0 };
const HOOK = { lx: 85, ly: 1230, ls: 0.8, lo: 1, px: 300, py: 2100, ps: 1.4, pr: 6, po: 0 };
const PAIN = { lx: 85, ly: 1500, ls: 0.8, lo: 0.0, px: 300, py: 2100, ps: 1.4, pr: 6, po: 0 };
const SEND = { lx: -95, ly: 380, ls: 1.11, lo: 1, px: 300, py: 2100, ps: 1.4, pr: 6, po: 0 };
const LAND = { lx: -95, ly: -900, ls: 1.11, lo: 0, px: 288, py: 300, ps: 1.5, pr: 0, po: 1 };
const FREE = { ...LAND, py: 420, ps: 1.32, po: 0.25 };
const TEAM = { ...LAND, py: 300, ps: 1.5, po: 1 };
const END = { ...LAND, py: 2000, po: 0 };
const LAYOUT = [[0, START], [2.9, HOOK], [3.2, PAIN], [6.5, PAIN], [6.95, SEND], [9.35, SEND], [9.8, LAND], [12.7, LAND], [12.95, FREE], [14.5, FREE], [14.75, TEAM], [17.0, TEAM], [17.4, END]];

// word-by-word captions: each VO line split into chunks of up to 3 words, words timed by length
function caption(t) {
  for (const [key, at] of Object.entries(VO)) {
    const ln = LINES[key]; if (!ln) continue;
    if (t < at || t > at + ln.dur + 0.15) continue;
    if (key === "free" || key === "end" || key === "hook") return ""; // big type covers these
    const words = ln.text.replace("dot com", "dot com").split(" ");
    const w8 = words.map((w) => 0.6 + w.replace(/[^\w]/g, "").length);
    const tot = w8.reduce((a, b) => a + b, 0);
    let acc = 0; const times = w8.map((w) => { const s = at + (acc / tot) * ln.dur; acc += w; return s; });
    let idx = 0; for (let i = 0; i < words.length; i++) if (t >= times[i]) idx = i;
    // chunks of up to 3 words that never run across a full stop or question mark
    const chunks = []; let cur = [];
    words.forEach((w, i) => { cur.push(i); if (cur.length === 3 || /[.?!]$/.test(w)) { chunks.push(cur); cur = []; } });
    if (cur.length) chunks.push(cur);
    const ch = chunks.find((c) => c.includes(idx));
    return ch.map((i) => `<b class="${i === idx ? "on" : ""}">${words[i].replace(/[.,?!:]$/, "")}</b>`).join(" ");
  }
  return "";
}

async function render(t) {
  pending.length = 0;
  drawStars(t);
  $("g1").style.opacity = 0.25 + 0.1 * Math.sin(t * 0.8);
  $("g2").style.opacity = 0.18 + 0.08 * Math.sin(t * 0.7 + 1);
  const L = kf(t, LAYOUT);
  // a small punch-in on each cut
  const punch = 1 + 0.025 * Math.max(...LAYOUT.map(([a]) => clamp(1 - Math.abs(t - a) / 0.25)));
  $("lap").style.transform = `translate(${L.lx}px,${L.ly}px) scale(${L.ls * punch})`; $("lap").style.opacity = L.lo;
  $("ph").style.transform = `translate(${L.px}px,${L.py + Math.sin(t * 1.4) * 6}px) scale(${L.ps * punch}) rotate(${L.pr}deg)`; $("ph").style.opacity = L.po;

  let lap = ["send", 2 + (t % 1)], ph = ["receive", 20];
  if (t >= 6.9) lap = ["send", pw(t, MAP.send())];
  if (t >= 9.4) ph = ["receive", pw(t, MAP.receive())];
  if (t >= 14.6) ph = ["roomphone", pw(t, MAP.roomphone())];
  setImg($("lapImg"), frameSrc(...lap));
  setImg($("phImg"), frameSrc(...ph));

  // cursor on the laptop
  const S = 1100 / 1440;
  let cv = 0, cx = 700, cy = 420, press = 0, rp = -1, rx = 0, ry = 0;
  if (t >= 6.8 && t < 9.5) {
    const path = [[6.8, 820, 500], ...["fab", "files", "name", "send"].map((n) => [pwInv(mk("send", n).f - 1, MAP.send()), mk("send", n).x, mk("send", n).y, 1]), [9.5, 960, 640]];
    cv = win(t, 6.8, 9.5, 0.2, 0.2);
    let i = 1; while (i < path.length - 1 && t > path[i][0]) i++;
    const [t0, x0, y0] = path[i - 1], [t1, x1, y1] = path[i];
    const k = ease(clamp((t - t0) / Math.max(0.05, (t1 - t0) * 0.75)));
    cx = lerp(x0, x1, k); cy = lerp(y0, y1, k) - Math.sin(k * Math.PI) * Math.min(60, Math.hypot(x1 - x0, y1 - y0) * 0.12);
    for (const [tc, x, y, c] of path) if (c) {
      const d = t - tc;
      if (d > -0.1 && d < 0.1) press = Math.max(press, 1 - Math.abs(d) / 0.1);
      if (d >= 0 && d < 0.45) { rp = d / 0.45; rx = x; ry = y; }
    }
  }
  $("cur").style.opacity = cv;
  $("cur").style.transform = `translate(${cx * S - 6}px,${cy * S - 4}px) scale(${1.3 * (1 - press * 0.18)})`;
  $("rip").style.opacity = rp >= 0 ? (1 - rp) * 0.9 : 0;
  $("rip").style.transform = `translate(${rx * S}px,${ry * S}px) scale(${0.3 + rp * 1.2})`;

  // finger on the phone
  const P = 300 / 390;
  let fv = 0, fx = 300, fy = 760, fp = 0, pr = -1, px = 0, py = 0;
  const taps = ["ball", "download", "save"].map((n) => [pwInv(mk("receive", n).f - 1, MAP.receive()), mk("receive", n).x, mk("receive", n).y]);
  if (t >= 10.2 && t < 12.7) {
    fv = win(t, 10.2, 12.7, 0.2, 0.25);
    let tgt = taps[0]; for (const x of taps) if (t > x[0] + 0.25) tgt = taps[Math.min(taps.length - 1, taps.indexOf(x) + 1)];
    const prev = taps[Math.max(0, taps.indexOf(tgt) - 1)];
    const k = tgt === prev ? 1 : ease(clamp((t - (prev[0] + 0.25)) / Math.max(0.1, tgt[0] - prev[0] - 0.35)));
    fx = lerp(prev[1], tgt[1], k); fy = lerp(prev[2], tgt[2], k);
    for (const [tc, x, y] of taps) {
      const d = t - tc;
      if (d > -0.12 && d < 0.12) fp = Math.max(fp, 1 - Math.abs(d) / 0.12);
      if (d >= 0 && d < 0.5) { pr = d / 0.5; px = x; py = y; }
    }
    fy += clamp(Math.min(...taps.map(([tc]) => Math.abs(t - tc))) / 0.25) * 26;
  }
  $("fin").style.opacity = fv;
  $("fin").style.transform = `translate(${fx * P - 30}px,${fy * P - 8}px) scale(${0.62 * (1 - fp * 0.07)}) rotate(-8deg)`;
  $("prip").style.opacity = pr >= 0 ? (1 - pr) * 0.85 : 0;
  $("prip").style.transform = `translate(${px * P}px,${py * P}px) scale(${0.3 + pr * 1.0})`;

  // the file flies from the laptop down to where the phone comes in
  let svg = "";
  const fk = (t - 9.25) / 0.6;
  if (fk > 0 && fk < 1.4) {
    const a = [540, 820], b = [540, 1250];
    const head = clamp(fk), tail = clamp(fk - 0.4);
    const y0 = lerp(a[1], b[1], tail), y1 = lerp(a[1], b[1], head);
    svg += `<path d="M540 ${y0} L540 ${y1}" stroke="rgba(61,255,140,0.9)" stroke-width="8" stroke-linecap="round" style="filter:drop-shadow(0 0 14px rgba(61,255,140,1))"/><circle cx="540" cy="${y1}" r="${fk < 1 ? 20 : 0}" fill="#fff" style="filter:drop-shadow(0 0 22px rgba(61,255,140,1))"/>`;
  }
  // flash when it lands
  const fl = clamp((t - 9.9) / 0.4);
  if (fl > 0 && fl < 1) svg += `<rect width="1080" height="1920" fill="rgba(61,255,140,${0.18 * (1 - fl)})"/>`;
  $("fx").innerHTML = svg;

  // hook
  const pv = win(t, 0.0, 2.95, 0.01, 0.25);
  $("pov").style.opacity = pv;
  $("pov").style.transform = `translateY(${(1 - out(clamp(t / 0.3))) * 30}px) scale(${0.96 + 0.04 * out(clamp(t / 0.3))})`;
  [["n1", 3.05, 4.15], ["n2", 3.9, 4.75]].forEach(([id, at, strike]) => {
    const el = $(id); const k = clamp((t - at) / 0.25);
    el.style.opacity = k * clamp((5.75 - t) / 0.2);
    el.style.transform = `translateX(${(1 - out(k)) * -120}px) rotate(${id === "n1" ? -2 : 2}deg) scale(${0.9 + 0.1 * back(k)})`;
    el.querySelector("i").style.transform = `scaleX(${out(clamp((t - strike) / 0.2))})`;
    el.querySelector(".x").style.transform = `scale(${back(clamp((t - strike - 0.1) / 0.25))})`;
  });
  // logo
  const em = $("emblem"), ep = clamp((t - 5.7) / 0.35);
  em.style.opacity = win(t, 5.7, 6.85, 0.1, 0.2);
  em.style.transform = `scale(${0.4 + 0.6 * back(ep)}) rotate(${(1 - ep) * -50}deg)`;
  const lg = $("logo");
  lg.style.opacity = win(t, 5.95, 6.85, 0.1, 0.2);
  lg.style.clipPath = `inset(0 ${100 - 100 * out(clamp((t - 5.95) / 0.4))}% 0 0)`;
  // big words
  $("big").style.opacity = win(t, 12.85, 14.6, 0.1, 0.2);
  [["w1", 12.9], ["w2", 13.4], ["w3", 13.95]].forEach(([id, at]) => { const el = $(id); const k = clamp((t - at) / 0.2); el.style.opacity = k; el.style.transform = `scale(${0.6 + 0.4 * back(k)})`; });
  // tags
  const tag = (el, txt, x, y, v) => { el.innerHTML = txt; el.style.left = x + "px"; el.style.top = y + "px"; el.style.opacity = v; };
  tag($("tagL"), "<i></i>Your laptop", 90, L.ly - 70, win(t, 6.8, 9.3));
  tag($("tagP"), "<i></i>" + (t < 14.6 ? "Your phone" : "Your team · Studio North"), 300, L.py - 80, win(t, 9.9, 12.6) + win(t, 14.8, 17.0));
  // captions
  const sub = caption(t);
  $("sub").innerHTML = sub;
  $("sub").style.top = t < 3 ? "1395px" : t < 6 ? "1395px" : "1395px";
  // end card
  const ev = clamp((t - 17.3) / 0.35);
  $("endc").style.opacity = ev;
  $("endc").querySelector(".bio").style.transform = `translateX(-50%) scale(${0.85 + 0.15 * back(clamp((t - 18.0) / 0.35))})`;
  $("endc").querySelector(".arrow").style.transform = `translateY(${Math.sin(t * 6) * 14}px)`;
  $("fade").style.opacity = clamp((t - (DURATION - 0.6)) / 0.6);
  await Promise.all(pending);
}
window.render = render;
window.setMarks = (m) => { MARKS = m.__lines ? (LINES = Object.fromEntries(m.__lines.map((l) => [l.key, l])), m) : m; };
window.ready = Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
window.events = () => {
  const ev = [];
  const C = (shot, names, m, k) => names.forEach((n) => ev.push({ t: pwInv(mk(shot, n).f - 1, m), k }));
  C("send", ["fab", "files", "name", "send"], MAP.send(), "click");
  C("receive", ["ball", "download", "save"], MAP.receive(), "tap");
  ev.push({ t: 9.25, k: "launch" }, { t: 9.9, k: "arrive" }, { t: pwInv(mk("receive", "saved").f, MAP.receive()), k: "done" });
  for (const at of [15.0, 15.7, 16.4]) ev.push({ t: at, k: "arrive" });
  ev.push({ t: 4.15, k: "strike" }, { t: 4.75, k: "strike" }, { t: 5.7, k: "logo" }, { t: 17.3, k: "end" });
  for (const at of [3.05, 3.9]) ev.push({ t: at, k: "tap" });
  for (const at of [12.9, 13.4, 13.95]) ev.push({ t: at, k: "word" });
  for (const [a] of LAYOUT) ev.push({ t: a, k: "move" });
  return ev.sort((a, b) => a.t - b.t);
};
</script>
