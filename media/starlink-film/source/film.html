    const sp = A("leo") - A("old"), kk = ((t - A("old") - 1) / (sp * 0.7)); beam(2, SHIP, GEOP); beam(3, GEOP, GS); pkt.visible = kk > 0 && kk < 1; pkt.scale.setScalar(5); pkt.position.copy(along([SHIP, GEOP, GS], kk));
    lbl("l0", GEOP.clone().add(V(0, 4, 0)), t, A("old") + 0.6, A("leo"), "36,000 km up", "#ff6a6a"); say("tA", "There and back · <i>over half a second</i>", t, A("old") + sp * 0.5, A("leo")); }
  else if (t < A("swarm")) { const k = ease(clamp((t - A("leo")) / (A("swarm") - A("leo")))); const [p, q] = shipView(lerp(9, 5, k), lerp(5, 2.5, k)); camAt(p, q, 44);
    const s = nearest(SHIP, tt)[0]; const sp = satPos(s, tt); beam(0, SHIP, sp); lbl("l0", sp.clone().add(sp.clone().normalize().multiplyScalar(0.5)), t, A("leo") + 0.6, A("swarm"), "550 km up", "#3dff8c"); say("tA", "A few <b>hundredths</b> of a second", t, A("leo") + 1.4, A("swarm")); }
  else if (t < A("dish")) { const k = ease(clamp((t - A("swarm")) / (A("dish") - A("swarm")))); camAt(V(lerp(18, 32, k), lerp(14, 22, k), lerp(20, 30, k)), V(0, 0, 0), 44); say("tA", "Thousands of satellites · <b>~95 min</b> per orbit", t, A("swarm") + 0.8, A("dish")); }
  else if (t < A("ground")) { const sp = A("ground") - A("dish"); camAt(V(61.4, 1.6, 1.8), V(60, 0, 0), 44);
    const ang = Math.sin((t - A("dish")) * 0.8) * 0.5; cells.forEach(([c, i, j]) => { const ph = (i * Math.sin(ang) * 2.2 - t * 6) % 6.283; c.material.color.setHex(Math.sin(ph) > 0.3 ? 0x3dff8c : 0x1e3a2c); });
    panelBeam.visible = true; panelBeam.position.set(60 + Math.sin(ang) * 2, 2, 0); panelBeam.rotation.z = -ang; panelBeam.rotation.x = Math.PI;
    say("tA", "No motor · <b>steered by timing</b>", t, A("dish") + sp * 0.4, A("ground")); lbl("l0", V(60, 0.3, 0.9), t, A("dish") + 0.6, A("ground"), "hundreds of tiny antennas", "#3dff8c"); }
  else if (t < A("laser")) { const [p, q] = (() => { const mid = GS.clone(); const n = mid.clone().normalize(); return [mid.clone().add(n.multiplyScalar(5)).add(V(-3, 2, 3)), mid]; })(); camAt(p, q, 44);
    const s = nearest(GS, tt)[0]; const sp = satPos(s, tt); beam(0, sp, GS); lbl("l0", GS.clone().multiplyScalar(1.03), t, A("ground") + 0.6, A("laser"), "ground station · <b>internet</b>", "#3dff8c"); }
  else if (t < A("orbi")) { const ch = chain(tt); const pts = [SHIP, ...ch.map((o) => satPos(o, tt)), GS];
    for (let i = 0; i < pts.length - 1 && i < 8; i++) beam(i, pts[i], pts[i + 1]); beams[0].material.color.setHex(0x3dff8c); beams[pts.length - 2] && beams[Math.min(7, pts.length - 2)].material.color.setHex(0x3dff8c);
    const k = ease(clamp((t - A("laser")) / (A("orbi") - A("laser")))); const mid = SHIP.clone().lerp(GS, 0.5).normalize().multiplyScalar(R); camAt(mid.clone().multiplyScalar(lerp(2.0, 2.4, k)).add(V(0, 3, 0)), mid, 44);
    const kk = ((t - A("hop")) / (A("orbi") - A("hop") - 0.5)); pkt.visible = kk > 0 && kk < 1; pkt.scale.setScalar(2.5); pkt.position.copy(along(pts, kk));
    say("tA", t < A("hop") ? "Satellite → satellite · <b>lasers</b>" : "Hop · hop · hop → <b>online</b>", t, A("laser") + 0.6, A("orbi")); }
  else { const [p, q] = shipView(1.6, 0.7, 0.8); camAt(p, q, 44); const s = nearest(SHIP, tt)[0]; beam(0, SHIP, satPos(s, tt)); say("tA", "Online at sea · <b>Orbi works</b>", t, A("orbi") + 0.6, A("end")); }

  let sub = "";
  for (const ln of LINES.lines) { if (t < ln.at - 0.05 || t > ln.at + ln.dur + 0.1) continue; const words = ln.text.split(" "), total = words.reduce((s, w) => s + w.length + 2, 0); let acc = 0; const stt = words.map((w) => { const s = ln.at + (acc / total) * ln.dur; acc += w.length + 2; return s; }); let cur = 0; for (let i = 0; i < words.length; i++) if (t >= stt[i]) cur = i; const ch = []; let c = []; words.forEach((w, i) => { c.push(i); if (c.length === 3 || /[.,?!:]$/.test(w)) { ch.push(c); c = []; } }); if (c.length) ch.push(c); sub = ch.find((cc) => cc.includes(cur)).map((i) => words[i]).join(" "); }
  $("sub").textContent = sub; S($("sub"), { opacity: t > A("end") - 0.1 ? 0 : 1 });
  const e = clamp((t - A("end") + 0.1) / 0.45); S($("endc"), { opacity: e }); document.querySelector("#endc .em").style.transform = `rotate(${(t - A("end")) * 25}deg) scale(${lerp(0.6, 1, back(e))})`;
  S($("fade"), { opacity: Math.max(1 - clamp(t / 0.3), clamp((t - (window.DURATION - 0.5)) / 0.5)) });
  r.render(scene, cam);
};

window.ready = true;
