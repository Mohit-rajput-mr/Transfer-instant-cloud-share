  screen(FRIEND, { layers: t > at("land") ? [["card", 1]] : [["empty", 1], ["one", clamp((t - at("pop") - 0.6) / 0.15)]], glow: t > at("pop") + 0.6 && t < at("land") ? Math.max(0, 1 - (t - at("pop") - 0.6) / 0.9) : 0 });
  for (const p of people) posePerson(p, t);

  // ---- the journey props (positions by time) ----
  // pack: the photo lifts off the screen, the box closes round it, the padlock clicks, the key goes home
  const P0 = at("pack"), lift = ease(clamp((t - P0 - 0.3) / 1.0)), close = ease(clamp((t - P0 - 1.6) / 0.7));
  card.position.copy(lerpV(V(0, 1.7, 0.04), BOX_C, lift)); card.scale.setScalar(lerp(1.3, 1, lift));
  card.visible = t < at("pieces") + 1.0 || (t > at("land") + 3.4 && t < at("burn"));
  box.position.copy(BOX_C); box.scale.set(lerp(1.6, 1, close), lerp(1.6, 1, close), lerp(1.6, 1, close)); box.visible = t > P0 + 1.5 && t < at("pieces") + 1.0 || (t > at("land") + 1.6 && t < at("land") + 3.9);
  boxGlass.material.opacity = 0.18 * close;
  const lockIn = clamp((t - P0 - 2.4) / 0.5), shut = clamp((t - P0 - 3.0) / 0.25);
  lock1.position.copy(BOX_C).add(V(0, -0.38 + (1 - out(lockIn)) * 0.8, 0.26)); lock1.userData.shackle.position.y = 0.17 + (1 - shut) * 0.1;
  lock1.visible = (t > P0 + 2.4 && t < at("pieces") + 1.0);
  // the key: shown, then back into your phone (it never travels)
  const keyIn = clamp((t - P0 - 3.6) / 0.4), keyHome = ease(clamp((t - P0 - 4.6) / 1.0));
  key.position.copy(lerpV(BOX_C.clone().add(V(0.75, 0.1, 0.3)), V(0.25, 1.1, -0.04), keyHome)); key.scale.setScalar(out(keyIn) * (1 - keyHome * 0.6)); key.rotation.set(0, -0.4 + t * 0.4, 0.2);
  key.visible = t > P0 + 3.6 && t < at("pieces"); keyLight.intensity = 3 * keyIn;
  // pieces: split, then fly in two waves of three
  const S0 = at("pieces"), split = ease(clamp((t - S0 - 0.6) / 0.6));
  pieces.forEach((pc, i) => {
    const home = homeOf(i), apart = home.clone().add(V(((i % 3) - 1) * 0.16, (i < 3 ? 0.12 : -0.12), 0.1));
    const fly = clamp((t - S0 - (i < 3 ? 1.6 : 2.9)) / 1.7);
    let pos;
    if (t < at("land")) pos = fly > 0 ? paths[i].getPointAt(ease(fly)) : lerpV(home, apart, split);
    else { const drop = ease(clamp((t - at("land") - 0.4 - i * 0.12) / 0.9)); pos = lerpV(slotOf(i).clone().add(V(0, 1.5, 0)), home, drop); }
    pc.position.copy(pos); pc.rotation.set(0, fly > 0 && fly < 1 ? fly * 6 : 0, 0);
    pc.visible = (t > S0 + 0.9 && t < at("ring")) || (t > at("land") + 0.3 && t < at("land") + 1.7) || (t > at("burn") && t < at("burn") + 2.6);
    if (t > at("burn")) { pc.position.copy(slotOf(i)); const hot = clamp((t - at("burn") - 0.6) / 1.6); pc.children[0].material.emissive.setHex(hot > 0 ? 0xff7a2a : 0x3dff8c); pc.children[0].material.emissiveIntensity = 0.6 + hot * 1.5; pc.scale.setScalar(1 - clamp((t - at("burn") - 2.3) / 0.3) * 0.9); }
    else { pc.children[0].material.emissive.setHex(0x3dff8c); pc.children[0].material.emissiveIntensity = 0.6; pc.scale.setScalar(1); }
  });
  tubes.forEach((tb, i) => (tb.material.opacity = 0.55 * win(t, S0 + (i < 3 ? 1.4 : 2.7), at("vault") + 0.6, 0.3, 0.5)));
  wheel.rotation.z = t > at("vault") + 1.4 ? (t - at("vault") - 1.4) * 1.2 : 0;
  // embers when the vault burns everything
  const eb = clamp((t - at("burn") - 2.4) / 1.4);
  for (let i = 0; i < emberN; i++) { const d = emberDir[i]; emberPos.set([VAULT.x + d[0] * out(eb) * 2.4, VAULT.y + d[1] * out(eb) * 2.4 - eb * eb, VAULT.z + 0.8 + d[2] * out(eb) * 2], i * 3); }
  emberGeo.attributes.position.needsUpdate = true; embers.material.opacity = eb > 0 ? 1 - eb : 0;
  // the board: a ring from the hall, your part of town lights up, the rest stays dark
  const R0 = at("ring"), wv = clamp((t - R0 - 1.0) / 1.6);
  wave.scale.setScalar(0.3 + wv * (HEX * 1.5 * AREA_R + 0.5)); wave.material.opacity = wv > 0 && wv < 1 ? 0.9 * (1 - wv * 0.6) : 0;
  fence.material.opacity = 0.1 * clamp((t - R0 - 2.4) / 0.6); fenceEdge.material.opacity = clamp((t - R0 - 2.4) / 0.6);
  for (const m of minis) { const inside = m.userData.d < HEX * 1.5 * AREA_R + 0.3; const got = inside && clamp((t - R0 - 1.0 - m.userData.d / 3.2) / 0.25); m.userData.scr.material.color.setHex(got > 0 ? 0x3dff8c : inside ? 0x2a3a52 : 0x1b2433); m.scale.setScalar(1 + (got > 0 && got < 1 ? 0.5 * Math.sin(got * Math.PI) : 0)); }
  pin.visible = t > R0 + 3.6; pin.position.y = 0.9 + (1 - out(clamp((t - R0 - 3.6) / 0.4))) * 0.8;

  // ---- shots ----
  if (t < at("scene")) {
    // a wedding: drift in over the guests towards the first dance
    world("hall"); const k = ease(clamp(t / 3.7));
    look(lerp(0.8, 0.3, k), lerp(2.4, 1.8, k), lerp(5.6, 2.8, k), 0, 1.15, -0.6, 44);
  } else if (t < at("scene") + 2.1) {
    world("hall"); const k = (t - at("scene")) / 2.1, a = 0.6 + k * 0.5;

  } else if (t < at("want")) {
    // you caught it (over your shoulder, phone up, the flash)
    world("hall"); const k = (t - at("scene") - 2.1) / (at("want") - at("scene") - 2.1);
    const yh = headWorld(YOU), dir = V(Math.sin(YOU.o.rotation.y), 0, Math.cos(YOU.o.rotation.y)), right = V(0, 1, 0).cross(dir).normalize();
    lookV(yh.clone().add(dir.clone().multiplyScalar(-0.45)).add(right.multiplyScalar(-0.5)).add(V(0, 0.28 - k * 0.05, 0)), V(0, 1.25, -0.6), 34);
    S($("flash"), { opacity: Math.max(0, 0.7 - Math.abs(t - at("scene") - 3.2) * 4) });
  } else if (t < at("old")) {
    // every guest turns to you
    world("hall"); const k = (t - at("want")) / 3;
    look(lerp(1.4, 1.0, k), 1.75, -1.6, YOU.o.position.x, 1.3, YOU.o.position.z, 50);
  } else if (t < at("send")) {
    world("hall"); const k = (t - at("old")) / 4.8;
    const yh = headWorld(YOU), dir = V(Math.sin(YOU.o.rotation.y), 0, Math.cos(YOU.o.rotation.y));
    lookV(yh.clone().add(dir.multiplyScalar(1.8 - k * 0.15)).add(V(0.35, 0.05, 0)), yh.clone().add(V(0, -0.2, 0)), 40);
    chip("o1", t, at("old") + 0.9, at("old") + 1.5); chip("o2", t, at("old") + 1.7, at("old") + 2.4); chip("o3", t, at("old") + 2.7, at("old") + 3.4);
  } else if (t < at("pop")) {
    world("hall"); overShoulder(YOU, (t - at("send")) / 5, 0.6, 0.04, 0.03, lerp(36, 31, ease(clamp((t - at("send")) / 5))));
    tag("tA", t, at("send") + 1.6, at("pop"), 540, 330);
  } else if (t < at("pop") + 1.5) {
    world("hall"); overShoulder(FRIEND, (t - at("pop")) / 1.5, 0.62, -0.05, 0.03, 34);
  } else if (t < at("pop") + 2.6) {
    world("hall"); overShoulder(crowd[4], (t - at("pop") - 1.5) / 1.1, 0.62, 0.05, 0.03, 34);
  } else if (t < at("how")) {
    // you shout the passcode
    world("hall"); const k = (t - at("pop") - 2.6) / 2.4;
    const yh = headWorld(YOU), dir = V(Math.sin(YOU.o.rotation.y), 0, Math.cos(YOU.o.rotation.y));
    lookV(yh.clone().add(dir.multiplyScalar(1.7 - k * 0.3)).add(V(0, -0.1, 0)), yh.clone().add(V(0, -0.15, 0)), 40);
    const sk = clamp((t - at("pop") - 3.4) / 0.2); S($("shout"), { opacity: sk * clamp((at("how") - t) / 0.2), transform: `scale(${lerp(1.6, 1, back(sk))}) rotate(-4deg)` });
  } else if (t < at("pack")) {
    // so what happens? dive into the phone's screen
    world("hall"); const k = ease(clamp((t - at("how")) / 2.8));
    overShoulder(YOU, 0, lerp(0.6, 0.12, k), 0.0, 0.0, lerp(34, 20, k));
    S($("flash"), { opacity: clamp((t - at("pack") + 0.35) / 0.3) * 0.9 });
  } else if (t < at("pieces")) {
    // sealed in a locked box; the key stays home
    world("jour"); holoScreen("photo"); const k = (t - at("pack")) / 7;
    look(lerp(0.6, 0.9, k), lerp(1.9, 1.85, k), lerp(3.4, 2.7, k), 0.15, 1.6, 0, 40);
    S($("flash"), { opacity: Math.max(0, 0.9 - (t - at("pack")) * 2) });
    tag("tB", t, at("pack") + 4.4, at("pieces"), 540, 330);
  } else if (t < at("vault")) {
    // cut into pieces, several fly at once
    world("jour"); holoScreen("empty"); const k = ease(clamp((t - at("pieces")) / 6.6));
    look(lerp(0.9, 4.2, k), lerp(1.9, 5.2, k), lerp(2.9, 3.4, k), 0, lerp(1.8, 5.6, k), lerp(0.3, -3.8, k), lerp(40, 48, k));
    tag("tC", t, at("pieces") + 1.8, at("vault"), 540, 330);
  } else if (t < at("ring")) {
    // the vault: still locked
    world("jour"); const k = (t - at("vault")) / 6;
    look(VAULT.x + lerp(2.4, 1.2, k), VAULT.y + 0.6, VAULT.z + lerp(4.6, 3.6, k), VAULT.x, VAULT.y, VAULT.z, 42);
    tag("tD", t, at("vault") + 2.6, at("ring"), 540, 330);
  } else if (t < at("land")) {
    // the ring: your part of the city, never the exact spot
    world("area"); const k = (t - at("ring")) / 7.6, a = 0.3 + k * 0.5;
    look(Math.sin(a) * 9, lerp(13, 10, k), -6 + Math.cos(a) * 9, 0, 0, -6, 46);
    tag("tE", t, at("ring") + 2.0, at("ring") + 4.4, 540, 330);
    tag("tF", t, at("ring") + 4.5, at("land"), 540, 330);
    if (t > at("ring") + 4.2) { const [x, y] = project(pin.getWorldPosition(V()).add(V(0, 0.3, 0))); S($("rx"), { left: `${x}px`, top: `${y}px`, opacity: clamp((t - at("ring") - 4.7) / 0.2), transform: `scale(${back(clamp((t - at("ring") - 4.7) / 0.3))})` }); }
  } else if (t < at("land") + 4.4) {
    // a guest taps it: the pieces drop, click together, and unlock with CAKE
    world("jour"); holoScreen("card"); holoEdge.material.color.setHex(0xf08a5d);
    const k = (t - at("land")) / 4.4;
    look(lerp(0.4, 0.7, k), 2.0, lerp(3.4, 2.8, k), 0, 1.75, 0, 40);
    const L0 = at("land");
    lock1.visible = t > L0 + 1.6 && t < L0 + 3.9; lock1.position.copy(BOX_C).add(V(0, -0.38, 0.26)); lock1.userData.shackle.position.y = 0.17 + clamp((t - L0 - 3.0) / 0.3) * 0.16;
    key.visible = t > L0 + 2.0 && t < L0 + 3.4; key.position.copy(BOX_C).add(V(0.4, -0.38, 0.36)); key.scale.setScalar(0.8); keyLight.intensity = 3;
    tag("tA", t, L0 + 2.0, L0 + 4.4, 540, 330);
    S($("flash"), { opacity: Math.max(0, 0.5 - Math.abs(t - L0 - 3.4) * 3) });
  } else if (t < at("burn")) {

  } else {

    world("jour"); const k = clamp((t - at("burn") - 0.3) / 2.0), gone = clamp((t - at("burn") - 2.4) / 0.3);
    look(VAULT.x + 1.4, VAULT.y + 0.4, VAULT.z + 4.2 - k * 0.4, VAULT.x, VAULT.y, VAULT.z, 42);
    const secs = Math.max(0, Math.round(1800 * (1 - ease(k))));
    $("timer").textContent = `${String(Math.floor(secs / 60)).padStart(2, "0")}:${String(secs % 60).padStart(2, "0")}`;
    S($("timer"), { opacity: 1 - gone, top: "1330px", color: k > 0.8 ? "#ff6a4a" : "#fff" });
    tag("tG", t, at("burn") + 3.0, at("end"), 540, 330);
  }


  // subtitles: 1–3 words at a time, in time with the voice
  let sub = "";
  for (const ln of LINES.lines) {
    if (t < ln.at - 0.05 || t > ln.at + ln.dur + 0.1) continue;
    const words = ln.text.split(" "), total = words.reduce((s, w) => s + w.length + 2, 0);
    let acc = 0; const st = words.map((w) => { const s = ln.at + (acc / total) * ln.dur; acc += w.length + 2; return s; });
    let cur = 0; for (let i = 0; i < words.length; i++) if (t >= st[i]) cur = i;
    // chunks of up to 3 words, broken at punctuation
    const chunks = []; let c = [];
    words.forEach((w, i) => { c.push(i); if (c.length === 3 || /[.,?!]$/.test(w)) { chunks.push(c); c = []; } }); if (c.length) chunks.push(c);
    const ch = chunks.find((cc) => cc.includes(cur));
    sub = ch.map((i) => words[i]).join(" ");
  }
  $("sub").textContent = sub;
  S($("sub"), { opacity: t > at("end") - 0.1 ? 0 : 1 });

  // end card
  const e = clamp((t - at("end") + 0.1) / 0.45);
  S($("endc"), { opacity: e });
  document.querySelector("#endc .em").style.transform = `rotate(${(t - at("end")) * 25}deg) scale(${lerp(0.6, 1, back(e))})`;
  S($("fade"), { opacity: Math.max(1 - clamp(t / 0.3), clamp((t - (window.DURATION - 0.5)) / 0.5)) });

  r.render(scene, cam);
};
