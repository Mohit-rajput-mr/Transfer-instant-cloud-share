<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Orbi Work · desktop demo</title>
<style>
  @font-face { font-family: "D"; src: url(fonts/archivo.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "M"; src: url(fonts/jetbrains.woff2) format("woff2"); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0d12; color: #fff; }
  #bg { position: absolute; inset: 0; background: radial-gradient(90% 55% at 50% 42%, #1d2433 0%, #0b0d12 70%); }
  #grid { position: absolute; inset: 0; opacity: .5; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 54px 54px; }
  #glow { position: absolute; left: 50%; top: 860px; width: 1300px; height: 700px; margin: -350px 0 0 -650px; border-radius: 50%; background: radial-gradient(closest-side, rgba(240,138,36,.22), transparent); filter: blur(20px); }
  /* the camera: everything inside moves together */
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  #laptop { position: absolute; left: 40px; top: 600px; width: 1000px; }
  #lid { position: relative; width: 1000px; height: 650px; border-radius: 30px 30px 10px 10px; background: linear-gradient(#2b2f37, #1a1d22); padding: 22px 22px 28px; box-shadow: 0 0 0 2px #3a3f48 inset, 0 50px 120px rgba(0,0,0,.6); }
  #lid::before { content: ""; position: absolute; left: 50%; top: 9px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #0c0d10; box-shadow: 0 0 0 2px #333842; }
  #screen { position: relative; width: 956px; height: 598px; border-radius: 6px; overflow: hidden; background: #f7f7f6; }
  #screen img { position: absolute; left: 0; top: 0; width: 956px; height: 598px; display: block; }
  #base { position: relative; left: -60px; width: 1120px; height: 34px; margin-top: -2px; border-radius: 4px 4px 26px 26px; background: linear-gradient(#cfd3da, #8a9099 60%, #5e646d); }
  #base::after { content: ""; position: absolute; left: 50%; top: 0; width: 170px; height: 10px; margin-left: -85px; border-radius: 0 0 12px 12px; background: #737982; }
  .ov { position: absolute; z-index: 20; pointer-events: none; }
  #chip { left: 0; right: 0; top: 260px; text-align: center; opacity: 0; }
  #chip span { display: inline-flex; align-items: center; gap: 14px; padding: 14px 26px; border-radius: 999px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.16); font: 700 34px/1 "M"; letter-spacing: .06em; text-transform: uppercase; color: #ffd2a6; }
  #chip b { color: #fff; font-weight: 800; }
  #title { left: 60px; right: 60px; top: 350px; text-align: center; font: 900 92px/1.02 "D"; font-stretch: 112%; letter-spacing: -.01em; opacity: 0; }
  #title em { font-style: normal; color: #f08a24; }
  #sub { left: 50px; right: 50px; top: 1480px; text-align: center; font: 800 70px/1.15 "D"; font-stretch: 100%; color: #fff; -webkit-text-stroke: 3px #000; paint-order: stroke fill; text-shadow: 0 4px 10px rgba(0,0,0,.65); z-index: 40; }
  #hook { inset: 0; display: grid; place-items: center; text-align: center; opacity: 0; }
  #hook .em { width: 220px; margin: 0 auto 40px; }
  #hook .lg { width: 760px; }
  #hook .w { margin-top: 26px; font: 700 40px/1 "M"; letter-spacing: .2em; color: #f08a24; }
  #endc { inset: 0; opacity: 0; background: radial-gradient(120% 80% at 50% 40%, #1a1f2b, #000 70%); text-align: center; z-index: 50; }
  #endc .em { position: absolute; left: 50%; top: 520px; width: 300px; margin-left: -150px; }
  #endc .lg { position: absolute; left: 90px; top: 880px; width: 900px; }
  #endc .url { position: absolute; left: 50%; top: 1060px; transform: translateX(-50%); padding: 24px 46px; border-radius: 999px; border: 2px solid rgba(255,255,255,.45); font: 600 46px/1 "M"; letter-spacing: .04em; white-space: nowrap; }
  #endc .try { position: absolute; left: 0; right: 0; top: 1210px; font: 700 32px/1 "M"; letter-spacing: .14em; text-transform: uppercase; color: #f08a24; }
  #flash { inset: 0; background: #fff; opacity: 0; z-index: 45; }
  #fade { inset: 0; background: #000; opacity: 1; z-index: 60; }
</style>
</head>
<body>
<div id="bg"></div><div id="grid"></div><div id="glow"></div>
<div id="stage">
  <div id="laptop"><div id="lid"><div id="screen"><img id="shot" /></div></div><div id="base"></div></div>
</div>
<div class="ov" id="hook"><div><img class="em" src="emblem.svg" /><img class="lg" src="logo.svg" /><div class="w">FOR WORK</div></div></div>
<div class="ov" id="chip"><span><b id="chipn">01</b><i id="chipt">Private space</i></span></div>
<div class="ov" id="title"></div>
<div class="ov" id="sub"></div>
<div class="ov" id="endc"><img class="em" src="emblem.svg" /><img class="lg" src="logo.svg" /><div class="url">orbitransfer.com/work</div><div class="try">Try it with your team</div></div>
<div class="ov" id="flash"></div>
<div class="ov" id="fade"></div>
<script type="module">
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const out = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const S = (el, o) => Object.assign(el.style, o);
const LINES = await (await fetch("vo/lines.json")).json();
const L = Object.fromEntries(LINES.lines.map((l) => [l.key, l]));
const at = (k) => L[k].at, end = (k) => L[k].at + L[k].dur;
const fr = (k, a) => L[k].at + L[k].dur * a;
const CLIPS = await (await fetch("rec/clips.json")).json(); // { clip: frameCount }
window.DURATION = LINES.duration;

// the screen sits at these stage coordinates (laptop 40,600 + lid padding 22)
const SX = 62, SY = 622, SW = 956, SH = 598;
// a focus is a point on the screen (0..1) and a zoom; the camera keeps that point at (540, FY)
const FY = 900;
function camera(fx, fy, z) {
  const px = SX + fx * SW, py = SY + fy * SH;
  S($("stage"), { transform: `translate(${540 - px * z}px, ${FY - py * z}px) scale(${z})` });
}
let src = "";
async function show(clip, k) {
  const n = CLIPS[clip] || 1;
  const s = `rec/${clip}/${String(Math.min(n - 1, Math.round(k * (n - 1)))).padStart(5, "0")}.jpg`;
  if (s !== src) { src = s; $("shot").src = s; await $("shot").decode().catch(() => {}); }
}
// beats: [voice key, clip, play window (fractions of the line or absolute), camera keys [k, fx, fy, zoom]...]
import SHOTS from "./shots.js";

window.render = async function (t) {
  S($("flash"), { opacity: 0 });
  // the hook: logo, then the laptop slides up
  const h = clamp((t - 0.1) / 0.4) * clamp((end("hook") + 0.2 - t) / 0.35);
  S($("hook"), { opacity: h, transform: `scale(${lerp(0.94, 1, out(clamp(t / 0.8)))})` });
  const shot = SHOTS(t, { at, end, fr });
  if (shot) {
    await show(shot.clip, shot.k);
    camera(shot.fx, shot.fy, shot.z);
    S($("chip"), { opacity: shot.chipA }); $("chipn").textContent = shot.n; $("chipt").textContent = shot.label;
    S($("title"), { opacity: shot.titleA, transform: `translateY(${(1 - shot.titleA) * 20}px)` }); $("title").innerHTML = shot.title || "";
    S($("laptop"), { opacity: 1 });
  } else {
    await show("space", 0);
    camera(0.5, 0.5, 1);
    S($("laptop"), { opacity: clamp((t - end("hook") + 0.3) / 0.4) });
    S($("chip"), { opacity: 0 }); S($("title"), { opacity: 0 });
  }

  // subtitles: 1–3 words at a time, in time with the voice
  let sub = "";
  for (const ln of LINES.lines) {
    if (t < ln.at - 0.05 || t > ln.at + ln.dur + 0.1) continue;
    const words = ln.text.split(" "), total = words.reduce((s, w) => s + w.length + 2, 0);
    let acc = 0; const st = words.map((w) => { const s = ln.at + (acc / total) * ln.dur; acc += w.length + 2; return s; });
    let cur = 0; for (let i = 0; i < words.length; i++) if (t >= st[i]) cur = i;
    const chunks = []; let c = [];
    words.forEach((w, i) => { c.push(i); if (c.length === 3 || /[.,?!]$/.test(w)) { chunks.push(c); c = []; } }); if (c.length) chunks.push(c);
    sub = chunks.find((cc) => cc.includes(cur)).map((i) => words[i]).join(" ");
  }
  $("sub").textContent = sub;
  S($("sub"), { opacity: t > at("end") - 0.1 || t < end("hook") ? 0 : 1 });
  const e = clamp((t - at("end") + 0.1) / 0.45);
  S($("endc"), { opacity: e });
  document.querySelector("#endc .em").style.transform = `rotate(${(t - at("end")) * 25}deg) scale(${lerp(0.6, 1, back(e))})`;
  S($("fade"), { opacity: Math.max(1 - clamp(t / 0.3), clamp((t - (window.DURATION - 0.5)) / 0.5)) });
};
await document.fonts.ready;
window.ready = true;
</script>
</body>
</html>
